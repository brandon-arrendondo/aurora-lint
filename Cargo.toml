[package]
name = "sqc"
version = "0.4.317"
edition = "2021"
description = "Software Code Quality - CERT C compliance checker"
authors = ["Eric Buehler <eric.buehler@bissell.com>", "Brandon Arrendondo <brandon.arrendondo@bissell.com>"]
license = "Apache-2.0"
repository = "https://github.com/brandon-arrendondo/tools_sqc"
homepage = "https://brandon-arrendondo.github.io/tools_sqc"
documentation = "https://brandon-arrendondo.github.io/tools_sqc"
readme = "README.md"
keywords = ["cert-c", "static-analysis", "security", "linter", "c"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.95"

# Allowlist what actually ships in the crate tarball. Everything else in the
# repo (data/, bench/, conf/, .claude/, paper/, tasks.py, the
# todo DB, etc.) is internal dev/research tooling, not part of the published
# tool.
include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "assets/icon.ico",
    "rules_templates/**",
    "tests/**",
    # Cargo auto-includes README/LICENSE files found anywhere in the tree even
    # under a restrictive `include`, so explicitly drop the stray ones that
    # live in directories we intentionally don't publish (include/exclude
    # can't both be set, so these are negated patterns within `include`).
    "!.pytest_cache/README.md",
    "!conf/realworld/README.md",
    "!data/precision_audit/**/README.md",
    "!docs/screenshots/README.md",
]

[lib]
name = "sqc"
path = "src/lib.rs"

[[bin]]
name = "sqc"
path = "src/main.rs"

[features]
default = []
# Interactive terminal UI (`--interactive`/`-i`). Disabled by default since the
# primary use of sqc is CLI + CI/CD; build with `--features tui` to enable it.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }
git2 = "0.19"
# Language detection + the C grammar come from the shared substrate (C-only:
# tools_sqc is a CERT-C checker). default-features = false keeps discovery
# scoped to C/.h and avoids pulling in the other 15 grammars. lang-cpp is
# enabled only for cpp_header::looks_like_cpp (a .h file compiled as C++
# despite the ambiguous extension, task 571) -- no C++ grammar-based
# analysis is otherwise performed; tools_sqc stays CERT-C only.
lang-parsing-substrate = { version = "0.7.0", default-features = false, features = ["lang-c", "lang-cpp"] }
tree-sitter = "0.25"
streaming-iterator = "0.1"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
csv = "1.3"
sha2 = "0.10"
regex = "1.10"
chrono = "0.4"
rust_xlsxwriter = "0.79"
serde_json = "1.0"
bincode = "1.3"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.14"
ctor = "0.2"
lazy_static = "1.4"

[build-dependencies]
winres = "0.1"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"

[profile.dev]
# Full debug info (the cargo default) embeds symbols for the whole
# dependency tree (git2, tree-sitter, rayon, ...) into every incremental
# build artifact. Line-tables-only keeps backtraces/line numbers useful
# for `cargo test`/`cargo build` while cutting target/ growth drastically.
debug = "line-tables-only"

# Dependencies are never stepped through; their line tables are pure target/
# weight. Own-crate debug info (above) is what backtraces actually need.
[profile.dev.package."*"]
debug = false

# Same for build scripts and their deps (winres/walkdir/serde/toml compiled
# for the host, then run once).
[profile.dev.build-override]
debug = false
