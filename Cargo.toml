[package]
name = "sqc"
version = "0.4.7"
edition = "2021"
description = "Software Code Quality - CERT C compliance checker"
authors = ["Eric Buehler <eric.buehler@bissell.com>", "Brandon Arrendondo <brandon.arrendondo@bissell.com>"]
license = "MIT"

[lib]
name = "sqc"
path = "src/lib.rs"

[[bin]]
name = "sqc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
ratatui = "0.28"
crossterm = "0.28"
git2 = "0.19"
tree-sitter = "0.22"
tree-sitter-c = "0.21"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
csv = "1.3"
sha2 = "0.10"
regex = "1.10"
chrono = "0.4"
rfd = "0.14"
rust_xlsxwriter = "0.79"
serde_json = "1.0"
bincode = "1.3"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.14"
ctor = "0.2"
lazy_static = "1.4"

[build-dependencies]
winres = "0.1"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
