[package]
name = "sqc"
version = "0.4.97"
edition = "2021"
description = "Software Code Quality - CERT C compliance checker"
authors = ["Eric Buehler <eric.buehler@bissell.com>", "Brandon Arrendondo <brandon.arrendondo@bissell.com>"]
license = "Apache-2.0"
repository = "https://github.com/brandon-arrendondo/tools_sqc"
homepage = "https://brandon-arrendondo.github.io/tools_sqc"
documentation = "https://brandon-arrendondo.github.io/tools_sqc"

[lib]
name = "sqc"
path = "src/lib.rs"

[[bin]]
name = "sqc"
path = "src/main.rs"

[features]
default = []
# Interactive terminal UI (`--interactive`/`-i`). Disabled by default since the
# primary use of sqc is CLI + CI/CD; build with `--features tui` to enable it.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }
git2 = "0.19"
# Language detection + the C grammar come from the shared substrate (C-only:
# tools_sqc is a CERT-C checker). default-features = false keeps discovery
# scoped to C/.h and avoids pulling in the other 15 grammars.
lang-parsing-substrate = { version = "0.3.0", default-features = false, features = ["lang-c"] }
tree-sitter = "0.25"
streaming-iterator = "0.1"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
csv = "1.3"
sha2 = "0.10"
regex = "1.10"
chrono = "0.4"
rfd = "0.14"
rust_xlsxwriter = "0.79"
serde_json = "1.0"
bincode = "1.3"
rayon = "1.10"

[dev-dependencies]
tempfile = "3.14"
ctor = "0.2"
lazy_static = "1.4"

[build-dependencies]
winres = "0.1"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
