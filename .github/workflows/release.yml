name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux x86_64 binary ─────────────────────────────────────────────
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        run: cargo build --release

      - name: Generate third-party license file
        run: |
          cargo install cargo-about --features cli
          cargo about generate about.hbs -o THIRD_PARTY_LICENSES.txt

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --format json --spec-version 1.5

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/release/aurora-lint dist/
          cp docs/aurora-lint.1 dist/
          cp README.md CHANGELOG.md LICENSE NOTICE THIRD_PARTY_LICENSES.txt dist/
          cp thirdparty/cert/LICENSE dist/LICENSE.CERT
          cp aurora-lint.cdx.json dist/
          tar -czf aurora-lint-linux-x86_64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-lint-linux-x86_64
          path: aurora-lint-linux-x86_64.tar.gz

  # ── Windows x86_64 binary (cross-compiled from Linux) ──────────────
  # NOTE: src/rules/cert_c/CON/ is a Windows reserved device name — native
  # Windows runners cannot check out the repo. Cross-compile instead.
  windows:
    name: Windows x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install MinGW cross-compiler and add Windows target
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Build Windows binary
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Generate third-party license file
        run: |
          cargo install cargo-about --features cli
          cargo about generate about.hbs -o THIRD_PARTY_LICENSES.txt

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --format json --spec-version 1.5

      - name: Package zip
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/aurora-lint.exe dist/
          cp README.md CHANGELOG.md LICENSE NOTICE THIRD_PARTY_LICENSES.txt dist/ 2>/dev/null || true
          cp thirdparty/cert/LICENSE dist/LICENSE.CERT 2>/dev/null || true
          cp aurora-lint.cdx.json dist/
          cd dist && zip -r ../aurora-lint-windows-x86_64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-lint-windows-x86_64
          path: aurora-lint-windows-x86_64.zip

  # ── Debian package ──────────────────────────────────────────────────
  deb:
    name: Debian package
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: aurora-lint-linux-x86_64
          path: .

      - name: Extract tarball
        run: mkdir -p dist && tar -xzf aurora-lint-linux-x86_64.tar.gz -C dist

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build .deb
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PKG_DIR="aurora-lint_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN" \
                   "${PKG_DIR}/usr/bin" \
                   "${PKG_DIR}/usr/share/man/man1" \
                   "${PKG_DIR}/usr/share/doc/aurora-lint"

          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: aurora-lint
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Brandon Arrendondo <brandon.arrendondo@bissell.com>
          Homepage: https://github.com/brandon-arrendondo/tools_sqc
          Description: CERT C compliance checker
           aurora-lint is a fast CERT C static analyzer
           built on tree-sitter for accurate C language analysis.
          EOF
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"

          cp dist/aurora-lint "${PKG_DIR}/usr/bin/"
          chmod 755 "${PKG_DIR}/usr/bin/aurora-lint"
          gzip -c dist/aurora-lint.1 > "${PKG_DIR}/usr/share/man/man1/aurora-lint.1.gz"
          cp dist/README.md "${PKG_DIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/CHANGELOG.md "${PKG_DIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/LICENSE "${PKG_DIR}/usr/share/doc/aurora-lint/copyright" 2>/dev/null || true
          cp dist/NOTICE "${PKG_DIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/LICENSE.CERT "${PKG_DIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/THIRD_PARTY_LICENSES.txt "${PKG_DIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/aurora-lint.cdx.json "${PKG_DIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true

          dpkg-deb --build --root-owner-group "${PKG_DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-lint-deb
          path: aurora-lint_*.deb

  # ── RPM package ─────────────────────────────────────────────────────
  rpm:
    name: RPM package
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - uses: actions/download-artifact@v4
        with:
          name: aurora-lint-linux-x86_64
          path: .

      - name: Extract tarball
        run: mkdir -p dist && tar -xzf aurora-lint-linux-x86_64.tar.gz -C dist

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build .rpm
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          TARDIR="aurora-lint-${VERSION}"
          mkdir -p "${TARDIR}/bin" "${TARDIR}/man" "${TARDIR}/doc"
          cp dist/aurora-lint "${TARDIR}/bin/"
          cp dist/aurora-lint.1 "${TARDIR}/man/"
          cp dist/README.md "${TARDIR}/doc/" 2>/dev/null || true
          cp dist/CHANGELOG.md "${TARDIR}/doc/" 2>/dev/null || true
          cp dist/LICENSE "${TARDIR}/doc/" 2>/dev/null || true
          cp dist/NOTICE "${TARDIR}/doc/" 2>/dev/null || true
          cp dist/LICENSE.CERT "${TARDIR}/doc/" 2>/dev/null || true
          cp dist/THIRD_PARTY_LICENSES.txt "${TARDIR}/doc/" 2>/dev/null || true
          cp dist/aurora-lint.cdx.json "${TARDIR}/doc/" 2>/dev/null || true
          tar -czf "rpmbuild/SOURCES/aurora-lint-${VERSION}.tar.gz" "${TARDIR}"
          rm -rf "${TARDIR}"

          cat > rpmbuild/SPECS/aurora-lint.spec << 'SPEC_EOF'
          Name:           aurora-lint
          Version:        VERSION_PLACEHOLDER
          Release:        1%{?dist}
          Summary:        CERT C compliance checker
          License:        Apache-2.0
          URL:            https://github.com/brandon-arrendondo/tools_sqc
          Source0:        %{name}-%{version}.tar.gz

          %description
          aurora-lint is a fast CERT C static analyzer
          built on tree-sitter for accurate C language analysis.

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_mandir}/man1
          mkdir -p %{buildroot}%{_docdir}/%{name}
          install -m 755 bin/aurora-lint %{buildroot}%{_bindir}/aurora-lint
          install -m 644 man/aurora-lint.1 %{buildroot}%{_mandir}/man1/aurora-lint.1
          install -m 644 doc/README.md %{buildroot}%{_docdir}/%{name}/README.md
          install -m 644 doc/CHANGELOG.md %{buildroot}%{_docdir}/%{name}/CHANGELOG.md
          install -m 644 doc/LICENSE %{buildroot}%{_docdir}/%{name}/LICENSE
          install -m 644 doc/NOTICE %{buildroot}%{_docdir}/%{name}/NOTICE
          install -m 644 doc/LICENSE.CERT %{buildroot}%{_docdir}/%{name}/LICENSE.CERT
          install -m 644 doc/THIRD_PARTY_LICENSES.txt %{buildroot}%{_docdir}/%{name}/THIRD_PARTY_LICENSES.txt
          install -m 644 doc/aurora-lint.cdx.json %{buildroot}%{_docdir}/%{name}/aurora-lint.cdx.json

          %files
          %{_bindir}/aurora-lint
          %{_mandir}/man1/aurora-lint.1*
          %doc %{_docdir}/%{name}/README.md
          %doc %{_docdir}/%{name}/CHANGELOG.md
          %license %{_docdir}/%{name}/LICENSE
          %license %{_docdir}/%{name}/NOTICE
          %license %{_docdir}/%{name}/LICENSE.CERT
          %doc %{_docdir}/%{name}/THIRD_PARTY_LICENSES.txt
          %doc %{_docdir}/%{name}/aurora-lint.cdx.json
          SPEC_EOF

          sed -i 's/^          //' rpmbuild/SPECS/aurora-lint.spec
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" rpmbuild/SPECS/aurora-lint.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/aurora-lint.spec
          cp rpmbuild/RPMS/x86_64/aurora-lint-*.rpm .

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-lint-rpm
          path: aurora-lint-*.rpm

  # ── AppImage ────────────────────────────────────────────────────────
  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - uses: actions/download-artifact@v4
        with:
          name: aurora-lint-linux-x86_64
          path: .

      - name: Extract tarball
        run: mkdir -p dist && tar -xzf aurora-lint-linux-x86_64.tar.gz -C dist

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download appimagetool
        run: |
          curl -Lo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Create AppDir
        run: |
          APPDIR="aurora-lint.AppDir"
          mkdir -p "${APPDIR}/usr/bin" \
                   "${APPDIR}/usr/share/man/man1" \
                   "${APPDIR}/usr/share/doc/aurora-lint" \
                   "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          cp dist/aurora-lint "${APPDIR}/usr/bin/"
          chmod 755 "${APPDIR}/usr/bin/aurora-lint"
          cp dist/aurora-lint.1 "${APPDIR}/usr/share/man/man1/"
          cp dist/LICENSE "${APPDIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/NOTICE "${APPDIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/LICENSE.CERT "${APPDIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/THIRD_PARTY_LICENSES.txt "${APPDIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp dist/aurora-lint.cdx.json "${APPDIR}/usr/share/doc/aurora-lint/" 2>/dev/null || true
          cp assets/icon.png "${APPDIR}/aurora-lint.png"
          cp assets/icon.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/aurora-lint.png"

          cat > "${APPDIR}/aurora-lint.desktop" << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=aurora-lint
          Exec=aurora-lint
          Icon=aurora-lint
          Comment=CERT C compliance checker
          Categories=Development;
          Terminal=true
          NoDisplay=true
          DESKTOP

          cat > "${APPDIR}/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE=$(dirname "$(readlink -f "$0")")
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/aurora-lint" "$@"
          APPRUN
          chmod +x "${APPDIR}/AppRun"

      - name: Build AppImage
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCH=x86_64 ./appimagetool aurora-lint.AppDir "aurora-lint-${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-lint-appimage
          path: aurora-lint-*.AppImage

  # ── GitHub Release ──────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, deb, rpm, appimage]
    steps:
      # fetch-depth 0: the notes are cut between this tag and the previous
      # one, so the generator needs the full tag list, not a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Release bodies used to be action-gh-release's compare-link stub, which
      # reads as automation churn to a distro reviewer. Build them from the
      # task database instead (scripts/generate_changelog.py, same source as
      # CHANGELOG.md). Rebuilt here rather than sliced out of the committed
      # file so the notes cannot lag a CHANGELOG.md regeneration.
      - name: Build release notes
        run: |
          python3 scripts/generate_changelog.py --release "${GITHUB_REF_NAME}" \
            > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          append_body: true
          generate_release_notes: true
          files: |
            artifacts/aurora-lint-linux-x86_64/*.tar.gz
            artifacts/aurora-lint-windows-x86_64/*.zip
            artifacts/aurora-lint-deb/*.deb
            artifacts/aurora-lint-rpm/*.rpm
            artifacts/aurora-lint-appimage/*.AppImage
