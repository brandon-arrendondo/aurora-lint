name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (tui feature)
        run: cargo clippy --all-targets --features tui -- -D warnings

  complexity:
    name: Complexity (knots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pre-commit
        run: pip install pre-commit

      - name: knots complexity gate (AIRD <= 85)
        run: pre-commit run knots --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo test (default features)
        run: cargo test

      - name: cargo test (tui feature)
        run: cargo test --features tui

  # bench/ is pure stdlib -- every module under it imports only the standard
  # library -- so this job installs nothing and needs no cache. Kept separate
  # from `test` so a Python failure is not reported as a Rust one.
  #
  # -W error::ResourceWarning is deliberate: the first run of this suite
  # surfaced two unclosed file handles in bench/db.py's ingest loop, which
  # nothing else would ever have failed on.
  bench-tests:
    name: Test (bench, python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: python3 -m unittest (bench/)
        run: python3 -W error::ResourceWarning -m unittest discover -s . -t . -v

  # macos-latest resolves to an Apple Silicon (arm64) runner. Task 1030
  # validated a clean build + full test suite on macOS with only Xcode CLT
  # (preinstalled on GitHub-hosted runners), so no extra system-dep step.
  test-macos:
    name: Test (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (default features)
        run: cargo test

      - name: cargo test (tui feature)
        run: cargo test --features tui

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage gate (75%)
        run: scripts/coverage-gate.sh 75

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  docs:
    name: Docs (GitHub Pages)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Sphinx and theme
        run: pip install sphinx sphinx-rtd-theme

      - name: Build HTML docs
        run: sphinx-build -b html docs docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
