name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# ubuntu-24.04 is pinned to match release.yml's build image; see the note there.

jobs:
  # Which suites a pull request needs, from scripts/landing_check.py (the
  # same classifier landings use). The Rust jobs below are skipped only for
  # a PR the classifier shows touches nothing but prose or Python outside
  # the crate; a skipped job counts as passed for a required check. A push
  # to main always runs everything, so the Pages docs job, which needs
  # `test`, always has it. If the classifier fails, the class is `full`.
  #
  # The classifier that grades a PR is the BASE commit's copy, so a PR
  # cannot loosen it for itself, and any PR touching the classifier or
  # .github/ runs everything regardless.
  classify:
    name: Classify change
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: classify
        name: Which suites does this change need?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          rust=true
          if [ "$EVENT" = pull_request ]; then
            class=full
            if base=$(git merge-base "$BASE" "$HEAD") &&
               git show "$base:scripts/landing_check.py" > scripts/landing_check_base.py; then
              class=$(python3 scripts/landing_check_base.py \
                        --base "$base" --head "$HEAD" --print class) || class=full
              # Captured first: under pipefail, `git diff | grep -q` fails
              # when grep exits early on a match.
              changed=$(git diff --name-only "$base" "$HEAD")
              if grep -qE '^(scripts/landing_check\.py|\.github/)' <<< "$changed"; then
                class=full
              fi
            fi
            echo "class: $class"
            case "$class" in docs|python) rust=false ;; esac
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (tui feature)
        run: cargo clippy --all-targets --features tui -- -D warnings

  complexity:
    # Keep the existing check name for branch-protection compatibility.
    name: Complexity (knots)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install pre-commit
        run: pip install pre-commit

      - name: All pre-commit hooks
        run: pre-commit run --all-files

      - name: Validate new commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          message=$(mktemp)
          trap 'rm -f "$message"' EXIT
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            commits=$(git rev-list -1 "$HEAD_SHA")
          else
            commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          fi
          for commit in $commits; do
            git show -s --format=%B "$commit" > "$message"
            pre-commit run --hook-stage commit-msg --commit-msg-filename "$message"
          done

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo test (default features)
        run: cargo test

      # The pre-commit hook skips docs/test-summary.md because it is not
      # tracked; the cargo test above has just regenerated it, so this is
      # where a generator that miscounts the rules fails.
      - name: Generated test summary states the manifest's rule counts
        run: python3 scripts/check_project_facts.py --generated

      - name: cargo test (tui feature)
        run: cargo test --features tui

  # bench/ is pure stdlib -- every module under it imports only the standard
  # library -- so this job installs nothing and needs no cache. Kept separate
  # from `test` so a Python failure is not reported as a Rust one.
  #
  # -W error::ResourceWarning is deliberate: the first run of this suite
  # surfaced two unclosed file handles in bench/db.py's ingest loop, which
  # nothing else would ever have failed on.
  bench-tests:
    name: Test (bench, python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: python3 -m unittest (bench/)
        run: python3 -W error::ResourceWarning -m unittest discover -s . -t . -v

      - name: Agent and commit guard regression tests
        run: python3 -W error::ResourceWarning -m unittest discover -s scripts -p 'test_check_*.py' -v

  # macos-latest resolves to an Apple Silicon (arm64) runner. An earlier
  # pass validated a clean build + full test suite on macOS with only Xcode CLT
  # (preinstalled on GitHub-hosted runners), so no extra system-dep step.
  test-macos:
    name: Test (macOS aarch64)
    runs-on: macos-latest
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (default features)
        run: cargo test

      - name: cargo test (tui feature)
        run: cargo test --features tui

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage gate (75%)
        run: scripts/coverage-gate.sh 75

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v6
        with:
          name: lcov
          path: lcov.info

  # The site root is main's build; each release's docs live under /<tag>/,
  # published by release.yml and never replaced. The deploy replaces the whole
  # gh-pages branch, so scripts/assemble_pages_site.py copies the published
  # release directories into the new site first. The `gh-pages` concurrency
  # group, shared with release.yml's docs job, keeps two deploys from reading
  # and writing the branch at once.
  # Each deploy replaces the whole gh-pages branch, so this job and
  # release.yml's docs job rebuild the complete site: main's build at the
  # root plus every published /<tag>/ directory, copied forward (see
  # scripts/assemble_pages_site.py). Two things can still delete release
  # directories, and no code here can stop them: re-running this job from a
  # run older than this scheme (it runs that commit's workflow, which
  # publishes main's build alone), and pushing to gh-pages by hand. Don't
  # do either; restore a lost directory from an earlier gh-pages commit.
  docs:
    name: Docs (GitHub Pages)
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Install Sphinx and theme
        run: pip install sphinx sphinx-rtd-theme

      - name: Build HTML docs
        run: sphinx-build -b html -d docs/_build/doctrees docs docs/_build/html

      - name: Fetch the published site
        run: scripts/fetch_published_pages.sh _site_published

      # A tag's docs job can be cancelled silently by a newer deploy in the
      # gh-pages group. Warn about any release since this scheme shipped
      # (its tree has the assembler) whose /<tag>/ is not published.
      - name: Warn about releases whose docs are not published
        run: |
          git fetch --quiet --tags origin
          tags=$(for t in $(git tag --list 'v*'); do
            if git cat-file -e "$t:scripts/assemble_pages_site.py" 2>/dev/null; then echo "$t"; fi
          done)
          python3 scripts/assemble_pages_site.py missing _site_published $tags

      - name: Assemble the site (main at the root, releases kept)
        run: python3 scripts/assemble_pages_site.py main docs/_build/html _site_published _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
