# Rules aurora-lint no longer ships (ADR-0013, Decisions 4 and 6).
#
# A removed rule is gone from the tool, not disabled: its implementation,
# its manifest blocks and its fixtures are deleted in the change that
# removes it, and an entry goes here in that same change. This file is what
# keeps the name in the inventory with its reason:
#
#   - a configuration that still has a [rules.cert_c.<id>] block for it
#     loads, with one warning naming the reason, and the block is ignored;
#   - `aurora-lint --list-rules` lists it under the removed rules;
#   - the real-world manifest check names it as removed rather than unknown.
#
# One [[removed]] table per rule, KEPT SORTED BY id (the loader refuses an
# out-of-order table): parallel removal branches then each add their entry in
# its own place instead of all conflicting at the end of the file. Every
# rule a `covered_by` names must be one the tool still ships (a test checks
# it against the registry). The full removal checklist is in
# docs/contributing.rst, "Removing a Rule".
#
#   [[removed]]
#   id = "ERR00-C"
#   removed_in = "0.7.0"              # the release the removal ships in:
#                                     # the target release, set up front
#   disposition = "covered"           # ADR-0013 Decisions 2 and 9, one of:
#                                     #   unenforceable, fails-criterion,
#                                     #   covered, deprecated,
#                                     #   moved-to-cwe (not a CERT C id; the
#                                     #     check stays, in the CWE ruleset),
#                                     #   not-cert-c (a CERT C++ guideline
#                                     #     shipped under a C id)
#   reason = "..."                    # one sentence, for users
#   covered_by = ["ERR33-C", "EXP12-C"]
#                                     # required for "covered" and
#                                     # "not-cert-c"; for "deprecated", the
#                                     # successor if any; refused for
#                                     # "moved-to-cwe"
#   moved_to = "CWE-327"              # required for "moved-to-cwe", and
#                                     # refused for any other disposition
#

[[removed]]
id = "CON50-C"
removed_in = "0.7.0"
disposition = "not-cert-c"
reason = "CERT C has no CON50-C; it is CERT C++'s CON50-CPP. CON31-C reports a mutex destroyed while locked, and CON34-C an automatic mutex shared with a thread"
covered_by = ["CON31-C", "CON34-C"]

[[removed]]
id = "DCL22-C"
removed_in = "0.7.0"
disposition = "unenforceable"
reason = "Whether an object can change asynchronously is a hardware or runtime fact the source does not mark; SIG31-C reports a signal handler's shared objects, and MSC22-C a local changed between setjmp and longjmp"

[[removed]]
id = "ERR06-C"
removed_in = "0.7.0"
disposition = "unenforceable"
reason = "Its checkable form reports every assert in a program that registers an exit handler, which contradicts MSC11-C, and a narrower form needs the programmer's intent"

[[removed]]
id = "FIO03-C"
removed_in = "0.7.0"
disposition = "unenforceable"
reason = "Whether opening a file for writing may replace an existing one is the programmer's intent, which the code does not show; the race on creating a file is FIO45-C's"

[[removed]]
id = "FIO50-C"
removed_in = "0.7.0"
disposition = "not-cert-c"
reason = "CERT C has no FIO50-C; it is CERT C++'s FIO50-CPP. FIO39-C reports the same alternation of input and output on one stream"
covered_by = ["FIO39-C"]

[[removed]]
id = "FIO51-C"
removed_in = "0.7.0"
disposition = "not-cert-c"
reason = "CERT C has no FIO51-C; it is CERT C++'s FIO51-CPP. FIO42-C reports the same file left open"
covered_by = ["FIO42-C"]

[[removed]]
id = "FLP05-C"
removed_in = "0.7.0"
disposition = "fails-criterion"
reason = "Its checkable form, a constant below the normal minimum of its type, cannot reach CERT's example, where the value is computed at run time"

[[removed]]
id = "INT14-C"
removed_in = "0.7.0"
disposition = "fails-criterion"
reason = "A readability recommendation, whose check reported CERT's own compliant exception for bit-vector serialization"

[[removed]]
id = "MSC14-C"
removed_in = "0.7.0"
disposition = "unenforceable"
reason = "An unnecessary platform dependency has no checkable form; C23 settles CERT's two's-complement example, and the integer rules cover it"

[[removed]]
id = "MSC42-C"
removed_in = "0.7.0"
disposition = "moved-to-cwe"
reason = "MSC42-C is not a CERT C identifier; the weak-cipher check is unchanged"
moved_to = "CWE-327"

[[removed]]
id = "POS55-C"
removed_in = "0.7.0"
disposition = "moved-to-cwe"
reason = "CERT C never published a POS55-C; the socket-ordering check is unchanged"
moved_to = "CWE-666"

[[removed]]
id = "PRE12-C"
removed_in = "0.7.0"
disposition = "fails-criterion"
reason = "CERT demoted it to a recommendation: a macro that evaluates a parameter more than once is a matter of style, and the hazard, an argument with side effects, is PRE31-C's"

[[removed]]
id = "PRE13-C"
removed_in = "0.7.0"
disposition = "fails-criterion"
reason = "CERT's noncompliant example is well defined (an undefined macro in #if evaluates to 0), and the check reported a common, correct idiom"

[[removed]]
id = "STR03-C"
removed_in = "0.7.0"
disposition = "unenforceable"
reason = "Whether truncating a string is acceptable is the programmer's intent (CERT's EX1), and CERT marks the rule unenforceable"

[[removed]]
id = "WIN05-C"
removed_in = "0.7.0"
disposition = "moved-to-cwe"
reason = "CERT C never published a WIN05-C; its unquoted CreateProcess path check is unchanged, and its registry check now reports only a write under HKEY_LOCAL_MACHINE or HKEY_CLASSES_ROOT, as CWE-272"
moved_to = "CWE-428"
