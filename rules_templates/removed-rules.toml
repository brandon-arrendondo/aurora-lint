# Rules aurora-lint no longer ships (ADR-0013, Decisions 4 and 6).
#
# A removed rule is gone from the tool, not disabled: its implementation,
# its manifest blocks and its fixtures are deleted in the change that
# removes it, and an entry goes here in that same change. This file is what
# keeps the name in the inventory with its reason:
#
#   - a configuration that still has a [rules.cert_c.<id>] block for it
#     loads, with one warning naming the reason, and the block is ignored;
#   - `aurora-lint --list-rules` lists it under the removed rules;
#   - the real-world manifest check names it as removed rather than unknown.
#
# One [[removed]] table per rule, KEPT SORTED BY id (the loader refuses an
# out-of-order table): parallel removal branches then each add their entry in
# its own place instead of all conflicting at the end of the file. Every
# rule a `covered_by` names must be one the tool still ships (a test checks
# it against the registry). The full removal checklist is in
# docs/contributing.rst, "Removing a Rule".
#
#   [[removed]]
#   id = "ERR00-C"
#   removed_in = "0.7.0"              # the release the removal ships in:
#                                     # the target release, set up front
#   disposition = "covered"           # ADR-0013 Decisions 2 and 9, one of:
#                                     #   unenforceable, fails-criterion,
#                                     #   covered, deprecated,
#                                     #   moved-to-cwe (not a CERT C id; the
#                                     #     check stays, in the CWE ruleset),
#                                     #   not-cert-c (a CERT C++ guideline
#                                     #     shipped under a C id)
#   reason = "..."                    # one sentence, for users
#   covered_by = ["ERR33-C", "EXP12-C"]
#                                     # required for "covered" and
#                                     # "not-cert-c"; for "deprecated", the
#                                     # successor if any; refused for
#                                     # "moved-to-cwe"
#   moved_to = "CWE-327"              # required for "moved-to-cwe", and
#                                     # refused for any other disposition
#

[[removed]]
id = "MSC42-C"
removed_in = "0.7.0"
disposition = "moved-to-cwe"
reason = "MSC42-C is not a CERT C identifier; the weak-cipher check is unchanged"
moved_to = "CWE-327"

[[removed]]
id = "POS55-C"
removed_in = "0.7.0"
disposition = "moved-to-cwe"
reason = "CERT C never published a POS55-C; the socket-ordering check is unchanged"
moved_to = "CWE-666"

[[removed]]
id = "WIN05-C"
removed_in = "0.7.0"
disposition = "moved-to-cwe"
reason = "CERT C never published a WIN05-C; the check is unchanged"
moved_to = "CWE-428"
