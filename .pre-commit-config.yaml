# Pre-commit hooks for tools_scq
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# Coverage gate (75% line coverage, cargo-llvm-cov) runs in CI only
# (.github/workflows/ci.yml) — it was removed from pre-commit because the
# instrumented build + full test run dominated commit wall-clock time.
# Run it manually before any tag push: scripts/coverage-gate.sh 75

# `pre-commit install` sets up BOTH hook types because of this line. Without
# it, the commit-msg hook below is silently inert in any clone that installed
# hooks before it existed -- the same trap the merge driver has. An older
# clone needs one manual pass: `pre-commit install --hook-type commit-msg`.
default_install_hook_types: [pre-commit, commit-msg]

# Every hook below runs at the pre-commit stage unless it says otherwise, and
# `no-ai-attribution` says otherwise (`stages: [commit-msg]`). Without this
# line a hook with no `stages:` runs at BOTH installed stages, so one commit
# prints the file-based hooks twice: once in the pre-commit block where they
# actually execute, and again in the commit-msg block as
# "(no files to check) Skipped", because that stage passes no filenames. The
# second block is harmless but reads exactly like the gate skipping, and it
# was reported up the chain as a gate failure on that basis. Stating the
# default removes the misleading half; nothing about what runs changes.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution trailers
        description: >-
          Reject parsed Git trailers naming a listed AI tool or vendor.
          CONTRIBUTING.md is the canonical policy: AI use is acknowledged
          once in README.md, rather than repeated per commit. Ordinary body
          mentions and human co-authors remain allowed.
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        verbose: true

  # Local hooks for Rust

  - repo: local
    hooks:
      - id: check-toml
        name: check TOML syntax
        description: >-
          Validate syntax of every changed TOML (rule manifests, benchmark
          manifests, real-world configs, Cargo.toml). Complements build.rs,
          which deep-validates only src/rules/** manifests and only at compile
          time. Dependency-free (stdlib tomllib, Python 3.11+).
        entry: python3 scripts/check_toml.py
        language: system
        files: \.toml$
        verbose: true

      - id: check-project-facts
        name: rule counts match the manifest
        description: >-
          Assert every rule count claimed in README.md, the docs and the
          generated docs/test-summary.md agrees with
          rules_templates/rules-all.toml. Eight files once claimed a count
          and gave three different answers (305, 306, 307), because the
          enabled count moves whenever a rule is toggled in the default
          manifest and nothing regenerates prose. The manifest is the source
          of truth, so enabling a rule needs no edit to this check -- only to
          whatever doc now disagrees. Renamed from check-rule-counts
          2026-09-17: same lint, same script (now check_project_facts.py),
          which also exports a broader fact set via --export-json for
          docs/conf.py and sqc_paper's cross-repo snapshot -- see that
          script's module docstring before extending this hook's scope.
        entry: python3 scripts/check_project_facts.py
        language: system
        pass_filenames: false
        files: '(rules_templates/(rules-all|removed-rules)\.toml|README\.md|docs/.*\.(rst|md)|src/lib\.rs|src/rules/cert_c/integration\.rs)$'
        verbose: true

      - id: check-removed-rules
        name: the not-shipped list is published and agrees with the table
        description: >-
          ADR-0013 Decision 6 requires README.md and docs/ to list every rule
          the tool no longer ships, with its reason. Both lists are rendered
          from rules_templates/removed-rules.toml between REMOVED-RULES
          markers by scripts/render_removed_rules.py; this fails when either
          is stale, or when a removed rule's row in
          docs/design/rule-disposition.md gives a different disposition or
          does not name its covering rules.
        entry: python3 scripts/render_removed_rules.py --check
        language: system
        pass_filenames: false
        files: '(rules_templates/removed-rules\.toml|README\.md|docs/configuration\.rst|docs/design/rule-disposition\.md|scripts/render_removed_rules\.py)$'
        verbose: true

      - id: check-realworld-manifests
        name: real-world manifests decide every rule
        description: >-
          Assert every conf/realworld/<cb>-rules.toml has a block for every
          rule in rules_templates/rules-all.toml, and that every
          `enabled = false` carries a comment naming its reason. Each manifest
          is standalone (--manifest replaces the base; there is no `extends`)
          and a scan iterates enabled_rules(), so a rule with no entry never
          runs on that codebase and nothing reports the gap -- an omission is
          byte-indistinguishable from an oversight. libcrc shipped as the base
          minus exactly MSC04-C and MSC07-C, a real decision that left no
          trace, and an audit first "fixed" it as drift. Adding a rule now
          fails here until all nine manifests carry a decision for it, which is
          also how a new rule stops being silently dark on the real-world
          suite.
        entry: python3 scripts/check_realworld_manifests.py
        language: system
        pass_filenames: false
        files: '(rules_templates/(rules-all|removed-rules)\.toml|conf/realworld/.*\.toml|src/rules/cert_c/.*\.toml)$'
        verbose: true

      - id: check-changelog-safety
        name: CHANGELOG.md locates no unlanded defect
        description: >-
          Scan a changed CHANGELOG.md for the ADR-0007 content deny patterns
          (a `file.c:123` location in a real-world corpus, disclosure /
          maintainer / CVE vocabulary). The file is generated from task
          titles, which are internal notes, and it ships in every release
          tarball; the generator publishes only tasks tagged `release-note`,
          and this is the independent second layer so a regeneration or a
          hand edit cannot silently publish a match. Same script runs in CI
          and in the release workflow over the release notes.
        entry: python3 scripts/check_changelog_safety.py
        language: system
        files: ^CHANGELOG\.md$
        verbose: true

      - id: cargo-fmt
        name: cargo fmt (auto-fix)
        description: Format Rust code with rustfmt
        entry: bash -c 'cargo fmt --all 2>&1 && echo "Formatting complete"'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with Clippy - deny warnings (all targets including tests)
        entry: bash -c 'cargo clippy --all-targets --all-features -- -D warnings 2>&1'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

  # knots complexity gate. The default `knots` hook ships args
  # [--aird-threshold=85], so no override is needed here. To tighten or add
  # metrics, set `args:` (pre-commit replaces them wholesale), e.g.
  #   args: [--aird-threshold=85, --cognitive-threshold=20]
  #
  # Scoped to this project's own source — Rust (src/, tests/) and Python
  # (bench/, mcp_servers/, scripts/). The repo's *.c/*.h files are all
  # deliberately-noncompliant CERT-C test fixtures, not production code, so
  # they are intentionally NOT gated.
  - repo: https://github.com/brandon-arrendondo/knots-pre-commit
    rev: v1.13.1
    hooks:
      - id: knots
        types_or: [rust, python]
