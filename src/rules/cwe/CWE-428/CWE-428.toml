[metadata]
id = "CWE-428"
type = "weakness"
category = "CWE"
number = 428
title = "Unquoted search path or element"
description = """
An executable path containing a space must be quoted in a CreateProcess
command line. With a NULL application name, Windows tries each
space-separated prefix of an unquoted path as a program
(C:\\Program.exe before C:\\Program Files\\App\\app.exe), so an executable
planted at a prefix runs instead (path interception).
"""
severity = "High"
likelihood = "Probable"
priority = "P6"
level = "L2"
cert_version = "Custom"
last_modified = "Oct 13, 2026"

[rules.cwe.CWE-428]
enabled = true

[references]
wiki = "https://cwe.mitre.org/data/definitions/428.html"
cwe = ["CWE-272"]
