[metadata]
id = "ENV33-C"
type = "rule"
category = "ENV"
number = 33
title = "Do not call system()"
description = """
The C Standard system() function executes a specified command by invoking an
implementation-defined command processor, such as a UNIX shell or CMD.EXE in
Microsoft Windows. The POSIX popen() and Windows _popen() functions also invoke
a command processor but create a pipe between the calling program and the
executed command, returning a pointer to a stream that can be used to either
read from or write to the pipe [IEEE Std 1003.1:2013].
Use of the system() function can result in exploitable vulnerabilities, in the
worst case allowing execution of arbitrary system commands. Situations in which
calls to system() have high risk include the following:
- When passing an unsanitized or improperly sanitized command string originating
from a tainted source
- If a command is specified without a path name and the command processor path
name resolution mechanism is accessible to an attacker
- If a relative path to an executable is specified and control over the current
working directory is accessible to an attacker
- If the specified executable program can be spoofed by an attacker
Do not invoke a command processor via system() or equivalent functions to
execute a command.
"""
severity = "High"
likelihood = "Probable"
priority = "P12"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.ENV33-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/pages/viewpage.action?pageId=87152177"
cwe = ["CWE-78", "CWE-426"]
related_cwe = ["CWE-88", "CWE-676"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "stricter"
differs = true
overlap = "STR02-C owns the tainted string (both fire); ENV03-C owns exec*/posix_spawn inheriting env"
basis = "yes. Default withholds bounded untainted commands by a named option (ENV33-C/2026-10-07/4); pedantic adds command processors started through other APIs (ENV33-C/2026-10-07/3)."
ruling = "ENV33-C/2026-10-07/4, ENV33-C/2026-10-07/3"
