[metadata]
id = "ENV32-C"
type = "rule"
category = "ENV"
number = 32
title = "All exit handlers must return normally"
description = """
The C Standard provides three functions that cause an application to terminate
normally: _Exit(), exit(), and quick_exit(). These are collectively called exit
functions. When the exit() function is called, or control transfers out of the
main() entry point function, functions registered with atexit() are called (but
not at_quick_exit()). When the quick_exit() function is called, functions
registered with at_quick_exit() (but not atexit()) are called. These functions
are collectively called exit handlers. When the _Exit() function is called, no
exit handlers or signal handlers are called.
Exit handlers must terminate by returning. It is important and potentially
safety-critical for all exit handlers to be allowed to perform their cleanup
actions. This is particularly true because the application programmer does not
always know about handlers that may have been installed by support libraries.
Two specific issues include nested calls to an exit function and terminating a
call to an exit handler by invoking longjmp.
A nested call to an exit function is undefined behavior. (See undefined behavior
187.) This behavior can occur only when an exit function is invoked from an exit
handler or when an exit function is called from within a signal handler. (See
SIG30-C. Call only asynchronous-safe functions within signal handlers.)
"""
severity = "Medium"
likelihood = "Likely"
priority = "P12"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.ENV32-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/ENV32-C.+All+exit+handlers+must+return+normally"
cwe = []
related_cwe = ["CWE-705"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "stricter"
differs = true
basis = "yes. Default withholds the defined terminations by a named option (ENV32-C/2026-10-09/1); pedantic adds non-ending handlers and unresolved callees and registrations (ENV32-C/2026-10-09/4, ENV32-C/2026-10-09/presets)."
ruling = "ENV32-C/2026-10-09/1, ENV32-C/2026-10-09/4, ENV32-C/2026-10-09/presets"
