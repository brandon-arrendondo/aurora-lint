[metadata]
id = "ENV31-C"
type = "rule"
category = "ENV"
number = 31
title = "Do not rely on an environment pointer following an operation that may invalidate it"
description = """
Some implementations provide a nonportable environment pointer that is valid
when main() is called but may be invalidated by operations that modify the
environment.
The C Standard, J.5.2 [ISO/IEC 9899:2024], states
In a hosted environment, the main function receives a third argument, char *
envp [], that points to a null-terminated array of pointers to char, each of
which points to a string that provides information about the environment for
this execution of the program (5.1.2.3.2).
Consequently, under a hosted environment supporting this common extension, it is
possible to access the environment through a modified form of main():
"""
severity = "Low"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.ENV31-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/ENV31-C.+Do+not+rely+on+an+environment+pointer+following+an+operation+that+may+invalidate+it"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
