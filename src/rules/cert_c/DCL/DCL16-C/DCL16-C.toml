[metadata]
id = "DCL16-C"
type = "recommendation"
category = "DCL"
number = 16
title = 'Use "L," not "l," to indicate a long value'
description = '''
Lowercase letter l (ell) can easily be confused with the digit 1 (one). This can
be particularly confusing when indicating that an integer literal constant is a
long value. This recommendation is similar to DCL02-C. Use visually distinct
identifiers. Likewise, you should use uppercase LL rather than lowercase ll when
indicating that an integer literal constant is a long long value.
To be precise when using modifiers to indicate the type of an integer literal,
the first character may not be l. It may be L, u, or U. Subsequent characters
have no strict case requirements.
'''
severity = "Low"
likelihood = "Unlikely"
priority = "P3"
level = "L3"
