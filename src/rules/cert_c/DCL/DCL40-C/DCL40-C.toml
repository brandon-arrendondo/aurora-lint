[metadata]
id = "DCL40-C"
type = "rule"
category = "DCL"
number = 40
title = "Do not create incompatible declarations of the same function or object"
description = """
Two or more incompatible declarations of the same function or object must not
appear in the same program because they result in undefined behavior. The C
Standard, 6.2.7, mentions that two types may be distinct yet compatible and
addresses precisely when two distinct types are compatible.
The C Standard identifies four situations in which undefined behavior (UB) may
arise as a result of incompatible declarations of the same function or object:
Although the effect of two incompatible declarations simply appearing in the
same program may be benign on most implementations, the effects of invoking a
function through an expression whose type is incompatible with the function
definition are typically catastrophic. Similarly, the effects of accessing an
object using an lvalue of a type that is incompatible with the object definition
may range from unintended information exposure to memory overwrite to a hardware
trap.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 06, 2025"

[rules.cert_c.DCL40-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/DCL40-C.+Do+not+create+incompatible+declarations+of+the+same+function+or+object"

[presets]
