[metadata]
id = "DCL37-C"
type = "rule"
category = "DCL"
number = 37
title = "Do not declare or define a reserved identifier"
description = """
According to the C Standard, 6.4.2.1 paragraph 7 [ISO/IEC 9899:2024],
Some identifiers are reserved. — All identifiers that begin with a double
underscore (__) or begin with an underscore (_) followed by an uppercase letter
are reserved for any use, except those identifiers which are lexically identical
to keywords. — All identifiers that begin with an underscore are reserved for
use as identifiers with file scope in both the ordinary and tag name spaces.
Other identifiers may be reserved, see 7.1.3.
C Standard, 7.1.3 paragraph 1 [ISO/IEC 9899:2024],
Each header declares or defines all identifiers listed in its associated
subclause, and optionally declares or defines identifiers listed in its
associated future library directions subclause and identifiers which are always
reserved either for any use or for use as file scope identifiers. — All
potentially reserved identifiers (including ones listed in the future library
directions) that are provided by an implementation with an external definition
are reserved for any use. An implementation shall not provide an external
definition of a potentially reserved identifier unless that identifier is
reserved for a use where it would have external linkage. All other potentially
reserved identifiers that are provided by an implementation (including in the
form of a macro) are reserved for any use when the associated header is
included. No other potentially reserved identifiers are reserved. — Each macro
name in any of the following subclauses (including the future library
directions) is reserved for use as specified if any of its associated headers is
included; unless explicitly stated otherwise (see 7.1.4). — All identifiers with
external linkage in any of the following subclauses (including the future
library directions) and errno are always reserved for use as identifiers with
external linkage. — Each identifier with file scope listed in any of the
following subclauses (including the future library directions) is reserved for
use as a macro name and as an identifier with file scope in the same name space
if any of its associated headers is included.
Additionally, subclause 7.33 defines many other reserved identifiers for future
library directions.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.DCL37-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/DCL37-C.+Do+not+declare+or+define+a+reserved+identifier"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
basis = "no. The feature-test exemption applies in every preset (DCL37-C/2026-10-07/presets)."
ruling = "DCL37-C/2026-10-07/presets"
