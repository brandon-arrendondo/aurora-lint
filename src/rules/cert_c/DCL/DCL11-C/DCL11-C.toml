[metadata]
id = "DCL11-C"
type = "recommendation"
category = "DCL"
number = 11
title = "Understand the type issues associated with variadic functions"
description = """
The variable parameters of a variadic function—that is, those that correspond
with the position of the ellipsis—are interpreted by the va_arg() macro. The
va_arg() macro is used to extract the next argument from an initialized argument
list within the body of a variadic function implementation. The size of each
parameter is determined by the specified type. If the type is inconsistent with
the corresponding argument, the behavior is undefined and may result in
misinterpreted data or an alignment error (see EXP36-C. Do not cast pointers
into more strictly aligned pointer types).
The variable arguments to a variadic function are not checked for type by the
compiler. As a result, the programmer is responsible for ensuring that they are
compatible with the corresponding parameter after the default argument
promotions:
- Integer arguments of types ranked lower than int are promoted to int if int
can hold all the values of that type; otherwise, they are promoted to unsigned
int (the integer promotions).
- Arguments of type float are promoted to double.
"""
