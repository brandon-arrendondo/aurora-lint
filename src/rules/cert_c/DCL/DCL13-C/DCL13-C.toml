[metadata]
id = "DCL13-C"
type = "recommendation"
category = "DCL"
number = 13
title = "Declare function parameters that are pointers to values not changed by the function as const"
description = """
Declaring function parameters const indicates that the function promises not to
change these values.
In C, function arguments are passed by value rather than by reference. Although
a function may change the values passed in, these changed values are discarded
once the function returns. For this reason, many programmers assume a function
will not change its arguments and that declaring the function's parameters as
const is unnecessary.
Pointers behave in a similar fashion. A function may change a pointer to
reference a different object, or NULL, yet that change is discarded once the
function exits. Consequently, declaring a pointer as const is unnecessary.
"""
severity = "Low"
likelihood = "Unlikely"
