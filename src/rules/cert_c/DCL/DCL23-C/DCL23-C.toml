title = "Guarantee that mutually visible identifiers are unique"
description = """
According to subclause 6.2.7 of the C Standard [ISO/IEC 9899:2011],
All declarations that refer to the same object or function shall have compatible
type; otherwise, the behavior is undefined.
(See also undefined behavior 14 of Annex J.)
Further, according to subclause 6.4.2.1,
