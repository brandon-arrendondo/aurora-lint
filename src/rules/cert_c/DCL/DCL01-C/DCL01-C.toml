[metadata]
id = "DCL01-C"
type = "recommendation"
category = "DCL"
number = 1
title = "Do not reuse variable names in subscopes"
description = """
Do not use the same variable name in two scopes where one scope is contained in
another. For example,
- No other variable should share the name of a global variable if the other
variable is in a subscope of the global variable.
- A block should not declare a variable with the same name as a variable
declared in any block that contains it.
Reusing variable names leads to programmer confusion about which variable is
being modified. Additionally, if variable names are reused, generally one or
both of the variable names are too generic.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P3"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.DCL01-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/DCL01-C.+Do+not+reuse+variable+names+in+subscopes"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
basis = "no (P/coincide)."
ruling = "P/coincide"
