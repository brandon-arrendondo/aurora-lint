[metadata]
id = "MEM34-C"
type = "rule"
category = "MEM"
number = 34
title = "Only free memory allocated dynamically"
description = """
The C Standard, Annex J (184) [ISO/IEC 9899:2024], states that the behavior of a
program is undefined when
The pointer argument to the free or realloc function does not match a pointer
earlier returned by a memory management function, or the space has been
deallocated by a call to free or realloc.
See also undefined behavior 184.
Freeing memory that is not allocated dynamically can result in heap corruption
and other serious errors. Do not call free() on a pointer other than one
returned by a standard memory allocation function, such as malloc(), calloc(),
realloc(), or aligned_alloc().
"""
severity = "High"
likelihood = "Likely"
priority = "P9"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 06, 2025"

[rules.cert_c.MEM34-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/MEM34-C.+Only+free+memory+allocated+dynamically"
cwe = ["CWE-590", "CWE-761"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "stricter"
differs = true
overlap = "EXP33-C owns an uninitialized pointer reaching free; MEM30-C owns double frees"
basis = "yes, at pedantic only: C23's sized-free matching, an edition gate (MEM34-C/2026-10-07/presets). Default equals strict; its validated-library option is an opt-in, not a preset difference."
ruling = "MEM34-C/2026-10-07/presets"
