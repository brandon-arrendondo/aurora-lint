[metadata]
id = "MEM05-C"
type = "recommendation"
category = "MEM"
number = 5
title = "Avoid large stack allocations"
description = """
Avoid excessive stack allocations, particularly in situations where the growth
of the stack can be controlled or influenced by an attacker. See INT04-C.
Enforce limits on integer values originating from tainted sources for more
information on preventing attacker-controlled integers from exhausting memory.
"""
severity = "Medium"
likelihood = "Likely"
priority = "P6"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 31, 2025"

[rules.cert_c.MEM05-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/MEM05-C.+Avoid+large+stack+allocations"
related = ["ENV01-C"]
cwe = ["CWE-674"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "stricter"
differs = true
overlap = "MSC04-C's recursion check moves here; base-case exemption not carried over"
basis = "yes, at pedantic only (bounded VLAs, `alloca` and recursion; MEM05-C/2026-10-07/stack-forms, MEM05-C/2026-10-07/recursion). Default equals strict. The rule is in the preset test matrix."
ruling = "MEM05-C/2026-10-07/stack-forms, MEM05-C/2026-10-07/recursion"
