[metadata]
id = "MEM01-C"
type = "recommendation"
category = "MEM"
number = 1
title = "Store a new value in pointers immediately after free()"
description = """
Dangling pointers can lead to exploitable double-free and access-freed-memory
vulnerabilities. A simple yet effective way to eliminate dangling pointers and
avoid many memory-related vulnerabilities is to set pointers to NULL after they
are freed or to set them to another valid object.
"""
severity = "High"
likelihood = "Unlikely"
priority = "P9"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Jul 24, 2025"

