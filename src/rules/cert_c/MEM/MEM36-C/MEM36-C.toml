[metadata]
id = "MEM36-C"
type = "rule"
category = "MEM"
number = 36
title = "Do not modify the alignment of objects by calling realloc()"
description = """
Do not invoke realloc() to modify the size of allocated objects that have
stricter alignment requirements than those guaranteed by malloc(). Storage
allocated by a call to the standard aligned_alloc() function, for example, can
have stricter than normal alignment requirements. The C standard requires only
that a pointer returned by realloc() be suitably aligned so that it may be
assigned to a pointer to any type of object with a fundamental alignment
requirement.
"""
severity = "Low"
likelihood = "Probable"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.MEM36-C]
enabled = true

