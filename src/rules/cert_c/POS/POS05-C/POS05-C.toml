[metadata]
id = "POS05-C"
type = "recommendation"
category = "POS"
number = 5
title = "Limit access to files by creating a jail"
description = """
Creating a jail isolates a program from the rest of the file system. The idea is
to create a sandbox, so entities the program does not need to access under
normal operation are made inaccessible. This makes it much harder to abuse any
vulnerability that can otherwise lead to unconstrained system compromise and
consequently functions as a defense-in-depth strategy. A jail may consist of
world-viewable programs that require fewer resources to execute than those that
exist on that system. Jails are useful only when there is no way to elevate
privileges in the event of program failure.
Additionally, care must be taken to ensure that all the required resources
(libraries, files, and so on) are replicated within the jail directory and that
no reference is made to other parts of the file system from within this
directory. It is also advisable to administer restrictive read/write permissions
on the jail directories and resources on the basis of the program's privilege
requirements. Although creating jails is an effective security measure when used
correctly, it is not a surrogate for compliance with the other rules and
recommendations in this standard.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
