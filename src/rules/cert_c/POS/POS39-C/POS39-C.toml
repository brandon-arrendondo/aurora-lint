[metadata]
id = "POS39-C"
type = "rule"
category = "POS"
number = 39
title = "Use the correct byte ordering when transferring data between systems"
description = """
Different system architectures use different byte ordering, either little endian
(least significant byte first) or big endian (most significant byte first).
IA-32 is an example of an architecture that implements little endian byte
ordering. In contrast, PowerPC and most Network Protocols (including TCP and IP)
use big endian.
When transferring data between systems of different endianness, the programmer
must take care to reverse the byte ordering before interpreting the data.
The functions htonl(), htons(), ntohl(), and ntohs() can be used to transfer
between network byte ordering (big endian) and the host's byte ordering. On big
endian systems, these functions do nothing. They may also be implemented as
macros rather than functions.
"""
severity = "Medium"
likelihood = "Likely"
priority = "P12"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 06, 2025"

[rules.cert_c.POS39-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/POS39-C.+Use+the+correct+byte+ordering+when+transferring+data+between+systems"

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "stricter"
differs = true
open_family = true
inferred = "Byte swaps under a host-order test, target variants (ntohll/htonll, pre-Issue-8 be32toh) and declared project helpers, beyond the enumerated ntohl, ntohs, htonl, htons and the <endian.h> functions under a declared Issue 8."
basis = "yes, in two places. Default credits inferred conversions (POS39-C/2026-10-09/4); pedantic adds closed forms beyond the text (POS39-C/2026-10-09/presets, /4, /6, /7)."
ruling = "POS39-C/2026-10-09/4, POS39-C/2026-10-09/presets, POS39-C/2026-10-09/6, POS39-C/2026-10-09/7"
