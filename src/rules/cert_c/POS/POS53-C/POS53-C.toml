[metadata]
id = "POS53-C"
type = "rule"
category = "POS"
number = 53
title = "Do not use more than one mutex for concurrent waiting operations on a condition variable"
description = """
pthread_cond_wait() and pthread_cond_timedwait() take a condition variable and
locked mutex as arguments. These functions unlock the mutex until the condition
variable is signaled and then relock the mutex before returning. While a thread
is waiting on a particular condition variable and mutex, other threads may only
wait on the same condition variable if they also pass the same mutex as an
argument. This requirement is noted in the Open Group Base Specifications, Issue
6:
As long as at least one thread is blocked on the condition variable. During this
time, the effect of an attempt by any thread to wait on that condition variable
using a different mutex is undefined.
It also specifies that pthread_cond_wait() may €? fail if:
[EINVAL] The value specified by cond or mutex is invalid. [EPERM] The mutex was
not owned by the current thread at the time of the call.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P8"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 06, 2025"

[rules.cert_c.POS53-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/POS53-C.+Do+not+use+more+than+one+mutex+for+concurrent+waiting+operations+on+a+condition+variable"

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
overlap = "no C11 twin (E10 does not apply)"
basis = "yes, at default only, by one named option (POS53-C/2026-10-07/option-start-routines). Pedantic equals strict. The C11 extension is a separate named option (POS53-C/2026-10-07/c11-condition-variables)."
ruling = "POS53-C/2026-10-07/option-start-routines, POS53-C/2026-10-07/c11-condition-variables"
