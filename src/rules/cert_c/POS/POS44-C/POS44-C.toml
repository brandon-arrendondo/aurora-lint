[metadata]
id = "POS44-C"
type = "rule"
category = "POS"
number = 44
title = "Do not use signals to terminate threads"
description = """
Do not send an uncaught signal to kill a thread because the signal kills the
entire process, not just the individual thread. This rule is a specific instance
of SIG02-C. Avoid using signals to implement normal functionality.
In POSIX systems, using the signal() function in a multithreaded program falls
under exception CON37C-C-EX0 of rule CON37-C. Do not call signal() in a
multithreaded program.
"""
severity = "Low"
likelihood = "Probable"
priority = "P2"
level = "L3"
