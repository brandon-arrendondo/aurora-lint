[metadata]
id = "POS51-C"
type = "rule"
category = "POS"
number = 51
title = "Avoid deadlock with POSIX threads by locking in predefined order"
description = """
Mutexes are often used to prevent multiple threads from accessing critical
resources at the same time. Sometimes, when locking mutexes, multiple threads
hold each other's lock, and the program consequently deadlocks. There are four
requirements for deadlock:
- Mutual exclusion
- Hold and wait
- No preemption
- Circular wait
Deadlock requires all four conditions, so to prevent deadlock, prevent any one
of the four conditions. This guideline recommends locking the mutexes in a
predefined order to prevent circular wait. This rule is a specific instance of
CON35-C. Avoid deadlock by locking in predefined order using POSIX threads.
"""
severity = "Low"
likelihood = "Probable"
priority = "P2"
level = "L3"
