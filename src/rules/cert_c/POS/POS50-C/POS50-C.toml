[metadata]
id = "POS50-C"
type = "rule"
category = "POS"
number = 50
title = "Declare objects shared between POSIX threads with appropriate storage durations"
description = """
Accessing the stack or thread-local variables of a thread from another thread
can cause invalid memory accesses because the execution of threads can be
interwoven within the constraints of the synchronization model. As a result, the
referenced stack frame or thread-local variable may not be valid when the other
thread tries to access it. Regular shared variables should be protected by
thread synchronization mechanisms. However, local variables should not be shared
in the same fashion because the referenced stack frame's thread would have to
stop executing, or some other way must be found to ensure that the referenced
stack frame is still valid. See CON32-C. Prevent data races when accessing bit-
fields from multiple threads for information on how to securely share
nonautomatic and non-thread-local variables. See DCL30-C. Declare objects with
appropriate storage durations for information on how to declare objects with
appropriate storage durations when data is not being shared between threads.
Note that this is a specific instance of CON34-C. Declare objects shared between
threads with appropriate storage durations for POSIX threads.
It is important to note that local data can be used securely with threads when
using other non-POSIX thread interfaces, so the programmer should not always
copy data into nonlocal memory when sharing data with threads. For example, the
shared keyword in OpenMP can be used in combination with OpenMP's threading
interface to share local memory without having to worry about whether local
automatic variables remain valid. Furthermore, copying the shared data into
dynamic memory may completely negate the performance benefits of multithreading.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.POS50-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/POS50-C.+Declare+objects+shared+between+POSIX+threads+with+appropriate+storage+durations"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
overlap = "CON34-C is the C11 twin sharing one analysis (E10); FIO45-C owns the dropped stat-then-use form"
basis = "no, apart from the named option of POS50-C/2026-10-07/option-lifetime, which is off by default (P/coincide)."
ruling = "POS50-C/2026-10-07/option-lifetime, P/coincide"
