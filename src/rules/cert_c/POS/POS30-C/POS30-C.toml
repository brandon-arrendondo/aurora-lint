[metadata]
id = "POS30-C"
type = "rule"
category = "POS"
number = 30
title = "Use the readlink() function properly"
description = '''
The readlink() function reads where a link points to. It makes no effort to
null-terminate its second argument, buffer. Instead, it just returns the number
of characters it has written.
'''
severity = "High"
likelihood = "Probable"
priority = "P18"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.POS30-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/POS30-C.+Use+the+readlink%28%29+function+properly"
cwe = []
related_cwe = ["CWE-170"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "stricter"
differs = true
basis = "yes. Default runs with POSIX assumed, works within one function and credits pre-zeroed buffers; `readlinkat` is default and pedantic only; pedantic adds closed-form tests (POS30-C/2026-10-09/5, /6, /8)."
ruling = "POS30-C/2026-10-09/5"
