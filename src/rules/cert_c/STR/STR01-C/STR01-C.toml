[metadata]
id = "STR01-C"
type = "recommendation"
category = "STR"
number = 1
title = "Adopt and implement a consistent plan for managing strings"
description = """
There are two basic approaches for managing strings in C programs: the first is
to maintain strings in statically allocated arrays; the second is to dynamically
allocate memory as required. Each approach has advantages and disadvantages.
However, it generally makes sense to select a single approach to managing
strings and apply it consistently across a project. Otherwise, the decision is
left to individual programmers who are likely to make different, inconsistent
choices.
Statically allocated strings assume a fixed-size character array, meaning that
it is impossible to add data after the buffer is filled. Because the static
approach discards excess data, actual program data can be lost. Consequently,
the resulting string must be fully validated.
Dynamically allocated buffers dynamically resize as additional memory is
required. Dynamic approaches scale better and do not discard excess data. The
major disadvantage is that, if inputs are not limited, they can exhaust memory
on a machine and consequently be used in denial-of-service attacks.
"""
