[metadata]
id = "STR34-C"
type = "rule"
category = "STR"
number = 34
title = "Cast characters to unsigned char before converting to larger integer sizes"
description = """
Signed character data must be converted to unsigned char before being assigned
or converted to a larger signed type. This rule applies to both signed char and
(plain) char characters on implementations where char is defined to have the
same range, representation, and behaviors as signed char.
However, this rule is applicable only in cases where the character data may
contain values that can be misinterpreted as negative numbers. For example, if
the char type is represented by a two's complement 8-bit value, any character
value greater than +127 is interpreted as a negative value.
This rule is a generalization of STR37-C. Arguments to character-handling
functions must be representable as an unsigned char.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P8"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Jun 05, 2025"

[rules.cert_c.STR34-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/STR34-C.+Cast+characters+to+unsigned+char+before+converting+to+larger+integer+sizes"
cwe = []
related_cwe = ["CWE-704"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
overlap = "STR37-C keeps <ctype.h> arguments"
basis = "yes, at default (the EX1 option, STR34-C/2026-10-07/ex1). Pedantic equals strict (P/open-cells) (STR34-C/2026-10-07/presets)."
ruling = "STR34-C/2026-10-07/ex1, P/open-cells, STR34-C/2026-10-07/presets"
