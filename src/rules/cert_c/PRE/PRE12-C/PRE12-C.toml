[metadata]
id = "PRE12-C"
type = "recommendation"
category = "PRE"
number = 12
title = "Do not define unsafe macros"
description = """
An unsafe function-like macro is one that, when expanded, evaluates its argument
more than once or does not evaluate it at all. Contrasted with function calls,
which always evaluate each of their arguments exactly once, unsafe function-like
macros often have unexpected and surprising effects and lead to subtle, hard-to-
find defects (see PRE31-C. Avoid side effects in arguments to unsafe macros).
Consequently, every function-like macro should evaluate each of its arguments
exactly once. Alternatively and preferably, defining function-like macros should
be avoided in favor of inline functions (see PRE00-C. Prefer inline or static
functions to function-like macros).
"""
severity = "Low"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 19, 2025"

[rules.cert_c.PRE12-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/PRE12-C.+Do+not+define+unsafe+macros"
related = ["PRE00-C", "PRE01-C", "PRE02-C", "PRE10-C"]

[presets]
default = "not_enforced"
strict = "not_enforced"
pedantic = "not_enforced"
differs = false
overlap = "PRE31-C owns the usage hazard"
basis = "no. Not enforced in any preset."
