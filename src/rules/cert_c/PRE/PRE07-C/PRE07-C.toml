[metadata]
id = "PRE07-C"
type = "recommendation"
category = "PRE"
number = 7
title = "Avoid using repeated question marks"
description = '''
Two consecutive question marks signify the start of a trigraph sequence.
According to the C Standard, subclause 5.2.1.1 [ISO/IEC 9899:2011],
All occurrences in a source file of the following sequences of three characters
(that is, trigraph sequences) are replaced with the corresponding single
character. ??=#??)]??!`??([??'^??>}??/\??<{??-~
'''
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 19, 2025"

[rules.cert_c.PRE07-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/PRE07-C.+Avoid+using+repeated+question+marks"

[presets]
