[metadata]
id = "PRE08-C"
type = "recommendation"
category = "PRE"
number = 8
title = "Guarantee that header file names are unique"
description = """
Make sure that included header file names are unique. According to the C
Standard, subclause 6.10.2, paragraph 5 [ISO/IEC 9899:2011],
The implementation shall provide unique mappings for sequences consisting of one
or more nondigits or digits (6.4.2.1) followed by a period (.) and a single
nondigit. The first character shall not be a digit. The implementation may
ignore distinctions of alphabetical case and restrict the mapping to eight
significant characters before the period.
This means that
- Only the first eight characters in the file name are guaranteed to be
significant.
- The file has only one nondigit character after the period in the file name.
- The case of the characters in the file name is not guaranteed to be
significant.
To guarantee that header file names are unique, all included files should differ
(in a case-insensitive manner) in their first eight characters or in their (one-
character) file extension.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 19, 2025"

[rules.cert_c.PRE08-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/PRE08-C.+Guarantee+that+header+file+names+are+unique"

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
basis = "yes, at default (PRE08-C/2026-10-07/default). Pedantic equals strict (P/open-cells)."
ruling = "PRE08-C/2026-10-07/default, P/open-cells"
