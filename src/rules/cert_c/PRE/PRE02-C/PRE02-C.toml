[metadata]
id = "PRE02-C"
type = "recommendation"
category = "PRE"
number = 2
title = "Macro replacement lists should be parenthesized"
description = """
Macro replacement lists should be parenthesized to protect any lower-precedence
operators from the surrounding expression. See also PRE00-C. Prefer inline or
static functions to function-like macros and PRE01-C. Use parentheses within
macros around parameter names.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P12"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 19, 2025"

[rules.cert_c.PRE02-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/PRE02-C.+Macro+replacement+lists+should+be+parenthesized"
related = ["PRE00-C", "PRE01-C", "PRE10-C", "PRE12-C"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
basis = "yes, at default only, by one named option (PRE02-C/2026-10-10/4). Pedantic equals strict (PRE02-C/2026-10-10/9)."
ruling = "PRE02-C/2026-10-10/4, PRE02-C/2026-10-10/9"
