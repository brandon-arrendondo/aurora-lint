[metadata]
id = "PRE06-C"
type = "recommendation"
category = "PRE"
number = 6
title = "Enclose header files in an include guard"
description = """
Until the early 1980s, large software development projects had a continual
problem with the inclusion of headers. One group might have produced a
graphics.h, for example, which started by including io.h. Another group might
have produced keyboard.h, which also included io.h. If io.h could not safely be
included several times, arguments would break out about which header should
include it. Sometimes an agreement was reached that each header should include
no other headers, and as a result, some application programs started with dozens
of #include lines, and sometimes they got the ordering wrong or forgot a
required header.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P3"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Jun 16, 2025"

[rules.cert_c.PRE06-C]
enabled = true

[references]
