[metadata]
id = "PRE09-C"
type = "recommendation"
category = "PRE"
number = 9
title = "Do not replace secure functions with deprecated or obsolescent functions"
description = """
Macros are frequently used in the remediation of existing code to globally
replace one identifier with another, for example, when an existing API changes.
Although some risk is always involved, this practice becomes particularly
dangerous if a function name is replaced with the function name of a deprecated
or obsolescent function. Deprecated functions are defined by the C Standard and
Technical Corrigenda. Obsolescent functions are defined by MSC24-C. Do not use
deprecated or obsolescent functions.
Although compliance with rule MSC24-C. Do not use deprecated or obsolescent
functions guarantees compliance with this recommendation, the emphasis of this
recommendation is the extremely risky and deceptive practice of replacing
functions with less secure alternatives.
"""
severity = "High"
likelihood = "Likely"
priority = "P18"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 29, 2025"

