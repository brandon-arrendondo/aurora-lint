[metadata]
id = "PRE31-C"
type = "rule"
category = "PRE"
number = 31
title = "Avoid side effects in arguments to unsafe macros"
description = """
An unsafe function-like macro is one whose expansion results in evaluating one
of its parameters more than once or not at all. Never invoke an unsafe macro
with arguments containing an assignment, increment, decrement, volatile access,
input/output, or other expressions with side effects (including function calls,
which may cause side effects).
The documentation for unsafe macros should warn against invoking them with
arguments with side effects, but the responsibility is on the programmer using
the macro. Because of the risks associated with their use, it is recommended
that the creation of unsafe function-like macros be avoided. (See PRE00-C.
Prefer inline or static functions to function-like macros.)
This rule is similar to EXP44-C. Do not rely on side effects in operands to
sizeof, _Alignof, or _Generic.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 31, 2025"

[rules.cert_c.PRE31-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/PRE31-C.+Avoid+side+effects+in+arguments+to+unsafe+macros"

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
options = ["pre31_unknown_call_pure"]
basis = "yes, at default (PRE31-C/2026-09-27/unproven-calls). Pedantic equals strict (P/open-cells)."
ruling = "PRE31-C/2026-09-27/unproven-calls, P/open-cells"
