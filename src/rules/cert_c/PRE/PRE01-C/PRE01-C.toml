[metadata]
id = "PRE01-C"
type = "recommendation"
category = "PRE"
number = 1
title = "Use parentheses within macros around parameter names"
description = """
Parenthesize all parameter names in macro definitions. See also PRE00-C. Prefer
inline or static functions to function-like macros and PRE02-C. Macro
replacement lists should be parenthesized.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P12"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 19, 2025"

[rules.cert_c.PRE01-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/PRE01-C.+Use+parentheses+within+macros+around+parameter+names"
related = ["PRE00-C", "PRE02-C", "PRE10-C", "PRE12-C"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
basis = "yes, at default only (PRE01-C/2026-10-09/2). Pedantic equals strict (PRE01-C/2026-10-09/7)."
ruling = "PRE01-C/2026-10-09/2, PRE01-C/2026-10-09/7"
