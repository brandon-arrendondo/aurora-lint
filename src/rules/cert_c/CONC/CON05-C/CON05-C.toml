[metadata]
id = "CON05-C"
type = "recommendation"
category = "CON"
number = 5
title = "Do not perform operations that can block while holding a lock"
description = """
If a lock is being held and an operation that can block is performed, any other
thread that needs to acquire that lock may also block. This condition can
degrade system performance or cause a deadlock to occur. Blocking calls include,
but are not limited to, network, file, and console I/O.
Using a blocking operation while holding a lock may be unavoidable for a
portable solution. For instance, file access could be protected via a lock to
prevent multiple threads from mutating the contents of the file. Or, a thread
may be required to block while holding one or more locks and waiting to acquire
another lock. In these cases, attempt to hold the lock for the least time
required. Additionally, if acquiring multiple locks, the order of locking must
avoid deadlock, as specified in CON35-C. Avoid deadlock by locking in a
predefined order.
"""
severity = "Low"
likelihood = "Probable"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Jul 02, 2025"

[rules.cert_c.CON05-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/CON05-C.+Do+not+perform+operations+that+can+block+while+holding+a+lock"
