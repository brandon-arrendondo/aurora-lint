[metadata]
id = "CON33-C"
type = "rule"
category = "CON"
number = 33
title = "Avoid race conditions when using library functions"
description = """
Some C standard library functions are not guaranteed to be reentrant with
respect to threads. Functions such as strtok() and asctime() return a pointer to
the result stored in function-allocated memory on a per-process basis. Other
functions such as rand() store state information in function-allocated memory on
a per-process basis. Multiple threads invoking the same function can cause
concurrency problems, which often result in abnormal behavior and can cause more
serious vulnerabilities, such as abnormal termination, denial-of-service attack,
and data integrity violations.
According to the C Standard, the library functions listed in the following table
may contain data races when invoked by multiple threads.
Section 2.9.1 of the Portable Operating System Interface (POSIX ®), Base
Specifications, Issue 7 [IEEE Std 1003.1:2013] extends the list of functions
that are not required to be thread-safe.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 31, 2025"

[rules.cert_c.CON33-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/CON33-C.+Avoid+race+conditions+when+using+library+functions"
cwe = []
related_cwe = ["CWE-330", "CWE-377", "CWE-676"]
related = ["CON34-C"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
overlap = "CON34-C no longer reports the non-thread-safe call form"
basis = "no. One form in every preset (P/coincide)."
ruling = "P/coincide"
