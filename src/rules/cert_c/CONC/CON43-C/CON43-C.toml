[metadata]
id = "CON43-C"
type = "rule"
category = "CON"
number = 43
title = "Do not allow data races in multithreaded code"
description = """
When multiple threads can read or modify the same data, use synchronization
techniques to avoid software flaws that can lead to security vulnerabilities.
Data races can often result in abnormal termination or denial of service, but it
is possible for them to result in more serious vulnerabilities. The C Standard,
section 5.1.2.5, paragraph 35 [ISO/IEC 9899:2024], says:
The execution of a program contains a data race if it contains two conflicting
actions in different threads, at least one of which is not atomic, and neither
happens before the other. Any such data race results in undefined behavior.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.CON43-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/CON43-C.+Do+not+allow+data+races+in+multithreaded+code"
cwe = ["CWE-366"]
