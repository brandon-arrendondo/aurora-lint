[metadata]
id = "CON39-C"
type = "rule"
category = "CON"
number = 39
title = "Do not join or detach a thread that was previously joined or detached"
description = """
The C Standard, 7.28.5.6 paragraph 2 [ISO/IEC 9899:2024], states that a thread
shall not be joined once it was previously joined or detached.
The termination of the other thread synchronizes with the completion of the
thrd_join function. The thread identified by thr shall not have been previously
detached or joined with another thread.
Similarly, subclause 7.28.5.3 paragraph 2 [ISO/IEC 9899:2024], states that a
thread shall not be detached once it was previously joined or detached.
The thrd_detach function tells the operating system to dispose of any resources
allocated to the thread identified by thr when that thread terminates. The
thread identified by thr shall not have been previously detached or joined with
another thread.
Violating either of these subclauses results in undefined behavior 211.
"""
severity = "Low"
likelihood = "Likely"
priority = "P3"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 31, 2025"

[rules.cert_c.CON39-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/CON39-C.+Do+not+join+or+detach+a+thread+that+was+previously+joined+or+detached"

[presets]
default = "as_written"
