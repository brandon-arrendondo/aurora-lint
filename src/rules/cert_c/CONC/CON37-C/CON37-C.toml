[metadata]
id = "CON37-C"
type = "rule"
category = "CON"
number = 37
title = "Do not call signal() in a multithreaded program"
description = """
Calling the signal() function in a multithreaded program is undefined behavior.
(See undefined behavior 135.)
"""
