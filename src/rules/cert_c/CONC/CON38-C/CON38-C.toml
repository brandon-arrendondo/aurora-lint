[metadata]
id = "CON38-C"
type = "rule"
category = "CON"
number = 38
title = "Preserve thread safety and liveness when using condition variables"
description = """
Both thread safety and liveness are concerns when using condition variables. The
thread-safety property requires that all objects maintain consistent states in a
multithreaded environment [Lea 2000]. The liveness property requires that every
operation or function invocation execute to completion without interruption; for
example, there is no deadlock.
Condition variables must be used inside a while loop. (See CON36-C. Wrap
functions that can spuriously wake up in a loop for more information.) To
guarantee liveness, programs must test the while loop condition before invoking
the cnd_wait() function. This early test checks whether another thread has
already satisfied the condition predicate and has sent a notification. Invoking
the cnd_wait() function after the notification has been sent results in
indefinite blocking.
To guarantee thread safety, programs must test the while loop condition after
returning from the cnd_wait() function. When a given thread invokes the
cnd_wait() function, it will attempt to block until its condition variable is
signaled by a call to cnd_broadcast() or to cnd_signal().
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.CON38-C]
enabled = true

[references]
