[metadata]
id = "CON35-C"
type = "rule"
category = "CON"
number = 35
title = "Avoid deadlock by locking in a predefined order"
description = """
Mutexes are used to prevent multiple threads from causing a data race by
accessing shared resources at the same time. Sometimes, when locking mutexes,
multiple threads hold each other's lock, and the program consequently deadlocks.
Four conditions are required for deadlock to occur:
- Mutual exclusion
- Hold and wait
- No preemption
- Circular wait
Deadlock needs all four conditions, so preventing deadlock requires preventing
any one of the four conditions. One simple solution is to lock the mutexes in a
predefined order, which prevents circular wait.
"""
severity = "Low"
likelihood = "Probable"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 31, 2025"

