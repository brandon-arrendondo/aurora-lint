[metadata]
id = "EXP32-C"
type = "rule"
category = "EXP"
number = 32
title = "Do not access a volatile object through a nonvolatile reference"
description = """
An object that has volatile-qualified type may be modified in ways unknown to
the implementation or have other unknown side effects. Referencing a volatile
object by using a non-volatile lvalue is undefined behavior. The C Standard,
6.7.4 paragraph 7 [ISO/IEC 9899:2024], states
If an attempt is made to refer to an object defined with a volatile-qualified
type through use of an lvalue with non-volatile-qualified type, the behavior is
undefined.
See undefined behavior 62.
"""
severity = "Low"
likelihood = "Likely"
priority = "P6"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.EXP32-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/EXP32-C.+Do+not+access+a+volatile+object+through+a+nonvolatile+reference"
