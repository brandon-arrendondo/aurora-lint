[metadata]
id = "EXP11-C"
type = "recommendation"
category = "EXP"
number = 11
title = "Do not make assumptions regarding the layout of structures with bit-fields"
description = """
The internal representations of bit-field structures have several properties
(such as internal padding) that are implementation-defined. Additionally, bit-
field structures have several implementation-defined constraints:
- The alignment of bit-fields in the storage unit (for example, the bit-fields
may be allocated from the high end or the low end of the storage unit)
- Whether or not bit-fields can overlap a storage unit boundary
Consequently, it is impossible to write portable safe code that makes
assumptions regarding the layout of bit-field structure members.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 20, 2025"

[rules.cert_c.EXP11-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/EXP11-C.+Do+not+make+assumptions+regarding+the+layout+of+structures+with+bit-fields"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
