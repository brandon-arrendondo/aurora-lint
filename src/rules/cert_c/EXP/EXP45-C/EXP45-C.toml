[metadata]
id = "EXP45-C"
type = "rule"
category = "EXP"
number = 45
title = "Do not perform assignments in selection statements"
description = """
Do not use the assignment operator in the contexts listed in the following table
because doing so typically indicates programmer error and can result in
unexpected behavior.
Performing assignment statements in other contexts do not violate this rule.
However, they may violate other rules, such as EXP30-C. Do not depend on the
order of evaluation for side effects.
Noncompliant Code Example
"""
