[metadata]
id = "EXP13-C"
type = "recommendation"
category = "EXP"
number = 13
title = "Treat relational and equality operators as if they were nonassociative"
description = """
The relational and equality operators are left-associative in C. Consequently,
C, unlike many other languages, allows chaining of relational and equality
operators. Subclause 6.5.8, footnote 107, of the C Standard [ISO/IEC 9899:2011],
says:
The expression a<b<c is not interpreted as in ordinary mathematics. As the
syntax indicates, it means (a<b)<c; in other words, "if a is less than b,
compare 1 to c; otherwise, compare 0 to c."
These operators are left-associative, which means the leftmost comparison is
performed first, and the result is compared with the rightmost comparison. This
syntax allows a programmer to write an expression (particularly an expression
used as a condition) that can be easily misinterpreted.
"""
