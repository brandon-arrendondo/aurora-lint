[metadata]
id = "EXP14-C"
type = "recommendation"
category = "EXP"
number = 14
title = "Beware of integer promotion when performing bitwise operations on integer types smaller than int"
description = """
Deprecated
This guideline has been deprecated by
- INT02-C. Understand integer conversion rules
Integer types smaller than int are promoted when an operation is performed on
them. If all values of the original type can be represented as an int, the value
of the smaller type is converted to an int; otherwise, it is converted to an
unsigned int (see INT02-C. Understand integer conversion rules). If the
conversion is to a wider type, the original value is zero-extended for unsigned
values or sign-extended for signed types. Consequently, bitwise operations on
integer types smaller than int may have unexpected results.
"""
severity = "low"
likelihood = "likely"
priority = "P3"
level = "L3"
