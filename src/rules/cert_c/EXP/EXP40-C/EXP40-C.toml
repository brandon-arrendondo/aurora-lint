[metadata]
id = "EXP40-C"
type = "rule"
category = "EXP"
number = 40
title = "Do not modify constant objects"
description = """
The C Standard, 6.7.4, paragraph 7 [IS O/IEC 9899:2024], states
If an attempt is made to modify an object defined with a const -qualified type
through use of an lvalue with non- const -qualified type, the behavior is
undefined.
See also undefined behavior 61.
There are existing compiler implementations that allow const -qualified objects
to be modified without generating a warning message.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 29, 2025"

[rules.cert_c.EXP40-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/EXP40-C.+Do+not+modify+constant+objects"
