[metadata]
id = "EXP37-C"
type = "rule"
category = "EXP"
number = 37
title = "Call functions with the correct number and type of arguments"
description = """
Do not call a function with the wrong number or type of arguments.
The C Standard identifies two distinct situations in which undefined behavior
(UB) may arise as a result of invoking a function using a declaration that is
incompatible with its definition or by supplying incorrect types or numbers of
arguments:
Functions that are appropriately declared (as in DCL40-C. Do not create
incompatible declarations of the same function or object) will typically
generate a compiler diagnostic message if they are supplied with the wrong
number or types of arguments. However, there are cases in which supplying the
incorrect arguments to a function will, at best, generate compiler warnings.
Although such warnings should be resolved, they do not prevent program
compilation. (See MSC00-C. Compile cleanly at high warning levels.)
"""
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 29, 2025"

[rules.cert_c.EXP37-C]
enabled = true

