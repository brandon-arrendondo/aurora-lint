[metadata]
id = "ERR05-C"
type = "recommendation"
category = "ERR"
number = 5
title = "Application-independent code should provide error detection without dictating error handling"
description = """
Application-independent code includes code that is
- Shipped with the compiler or operating system
- From a third-party library
- Developed in-house
When application-specific code detects an error, it can immediately respond with
a specific action, as in
This response occurs because the application must both detect errors and provide
a mechanism for handling errors. Application-independent code, by contrast, is
not associated with any application, so it cannot handle errors. However, it
must still detect errors and report them to an application so that the
application may handle them.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P8"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 06, 2025"

[rules.cert_c.ERR05-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/ERR05-C.+Application-independent+code+should+provide+error+detection+without+dictating+error+handling"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "stricter"
differs = true
overlap = "MSC11-C owns the plain-assert case; wrapper/macro fix covers always-on assert macros"
basis = "yes, at pedantic only: a plain `assert()` counts as a termination (ERR05-C/2026-10-07/presets). Default and strict coincide, and an always-on assert macro counts in every preset (ERR05-C/2026-10-07/assert)."
ruling = "ERR05-C/2026-10-07/presets, ERR05-C/2026-10-07/assert"
