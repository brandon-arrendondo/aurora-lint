[metadata]
id = "ERR01-C"
type = "recommendation"
category = "ERR"
number = 1
title = "Use ferror() rather than errno to check for FILE stream errors"
description = """
Use ferror() rather than errno to check whether an error has occurred on a file
stream (for example, after a long chain of stdio calls). The ferror() function
tests the error indicator for a specified stream and returns nonzero if and only
if the error indicator is set for the stream.
"""
