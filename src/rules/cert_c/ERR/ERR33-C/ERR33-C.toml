[metadata]
id = "ERR33-C"
type = "rule"
category = "ERR"
number = 33
title = "Detect and handle standard library errors"
description = """
The majority of the standard library functions, including I/O functions and
memory allocation functions, return either a valid value or a value of the
correct return type that indicates an error (for example, −1 or a null pointer).
Assuming that all calls to such functions will succeed and failing to check the
return value for an indication of an error is a dangerous practice that may lead
to unexpected or undefined behavior when an error occurs. It is essential that
programs detect and appropriately handle all errors in accordance with an error-
handling policy.
The successful completion or failure of each of the standard library functions
listed in the following table shall be determined either by comparing the
function’s return value with the value listed in the column labeled “Error
Return” or by calling one of the library functions mentioned in the footnotes.
Standard Library Functions
"""
severity = "High"
likelihood = "Likely"
priority = "P27"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.ERR33-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/ERR33-C.+Detect+and+handle+standard+library+errors"
cwe = ["CWE-252", "CWE-253", "CWE-390", "CWE-391", "CWE-690"]
related = ["ERR00-C", "FLP32-C"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "not_enforced"
differs = true
overlap = "MSC11-C reports a live assert that default treats as a guard"
open_family = true
inferred = "CERT's table plus fgetws and the C23 functions the declared c_standard has."
basis = "yes. Default narrows by named options and widens the function set (ERR33-C/2026-10-09/2, /6, /7, /9); pedantic declines the rule (ERR33-C/2026-10-09/7)."
ruling = "ERR33-C/2026-10-09/2, ERR33-C/2026-10-09/6, ERR33-C/2026-10-09/7, ERR33-C/2026-10-09/9"
