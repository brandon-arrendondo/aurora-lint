[metadata]
id = "ERR32-C"
type = "rule"
category = "ERR"
number = 32
title = "Do not rely on indeterminate values of errno"
description = """
According to the C Standard Annex J.2 (133) [ISO/IEC 9899:2024], the behavior of
a program is undefined when
the value of errno is referred to after a signal occurred other than as the
result of calling the abort or raise function and the corresponding signal
handler obtained a SIG_ERR return from a call to the signal function.
See undefined behavior 133.
A signal handler is allowed to call signal(); if that fails, signal() returns
SIG_ERR and sets errno to a positive value. However, if the event that caused a
signal was external (not the result of the program calling abort() or raise()),
the only functions the signal handler may call are _Exit() or abort(), or it may
call signal() on the signal currently being handled; if signal() fails, the
value of errno is indeterminate.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P3"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.ERR32-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/ERR32-C.+Do+not+rely+on+indeterminate+values+of+errno"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
overlap = "SIG00-C may co-fire (errno shared state)"
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
