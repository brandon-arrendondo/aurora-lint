[metadata]
id = "MSC00-C"
type = "recommendation"
category = "MSC"
number = 0
title = 'Compile cleanly at high warning levels'
description = '''
Compile code using the highest warning level available for your compiler and
eliminate warnings by modifying the code.
According to the C Standard, subclause 5.1.1.3 [ISO/IEC 9899:2011],
A conforming implementation shall produce at least one diagnostic message
(identified in an implementation-defined manner) if a preprocessing translation
unit or translation unit contains a violation of any syntax rule or constraint,
even if the behavior is also explicitly specified as undefined or
implementation-defined. Diagnostic messages need not be produced in other
circumstances.
Assuming a conforming implementation, eliminating diagnostic messages will
eliminate any syntactic or constraint violations.
'''
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Unknown"

[rules.cert_c.MSC00-C]
enabled = true

[references]
wiki = "https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/recommendations/miscellaneous-msc/msc00-c"
cwe = []
related_cwe = ["CWE-563", "CWE-570", "CWE-571"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
