[metadata]
id = "MSC12-C"
type = "recommendation"
category = "MSC"
number = 12
title = "Detect and remove code that has no effect or is never executed"
description = """
The presence of code that has no effect or is never executed may indicate a logic
error and may result in unexpected behavior. Such code includes statements whose
value is discarded (e.g., a == b; used as a statement), redundant subexpressions
in logical operators, duplicate conditions in if/else-if chains, unconditional
jump statements at the end of loops that would continue anyway, and static
functions that nothing calls and whose address never escapes. A static's uses
are read across its translation unit only as far as the scan finds its
headers: a header the scan cannot resolve (no -I, -d or compile database
names its directory) is not read, so a use there is not seen and the static
may be reported as uncalled.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Mar 25, 2026"

[rules.cert_c.MSC12-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/MSC12-C.+Detect+and+remove+code+that+has+no+effect+or+is+never+executed"
cwe = ["CWE-398", "CWE-482", "CWE-561", "CWE-570"]

[presets]
default = "widened"
strict = "as_written"
pedantic = "as_written"
differs = true
options = ["msc12_dead_callers"]
overlap = "absorbs MSC07-C"
basis = "yes, at default only: a static called only from code that never runs is reported (MSC12-C/2026-11-24/dead-callers). Every other form coincides (P/coincide)."
ruling = "MSC12-C/2026-11-24/dead-callers, P/coincide"
