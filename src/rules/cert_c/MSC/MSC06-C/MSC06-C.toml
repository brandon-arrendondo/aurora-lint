[metadata]
id = "MSC06-C"
type = "recommendation"
category = "MSC"
number = 6
title = 'Beware of compiler optimizations'
description = '''
Subclause 5.1.2.3 of the C Standard [ISO/IEC 9899:2011] states:
In the abstract machine, all expressions are evaluated as specified by the
semantics. An actual implementation need not evaluate part of an expression if
it can deduce that its value is not used and that no needed side effects are
produced (including any caused by calling a function or accessing a volatile
object).
This clause gives compilers the leeway to remove code deemed unused or unneeded
when building a program. Although this functionality is usually beneficial,
sometimes the compiler removes code that it thinks is not needed but has been
added for a specific (often security-related) purpose.
'''
severity = "Medium"
likelihood = "Probable"
priority = "P12"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "Unknown"

[rules.cert_c.MSC06-C]
enabled = true

[references]
wiki = "https://cmu-sei.github.io/secure-coding-standards/sei-cert-c-coding-standard/recommendations/miscellaneous-msc/msc06-c"
cwe = []
related_cwe = ["CWE-14"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "stricter"
differs = true
overlap = "MEM03-C/MEM06-C own sensitive-data clearing contract (related)"
basis = "yes. Default narrows to clears of objects that held data (MSC06-C/2026-10-09/presets). Pedantic credits less and reports more (MSC06-C/2026-10-09/4, MSC06-C/2026-10-09/5, the C-library assumption)."
ruling = "MSC06-C/2026-10-09/presets, MSC06-C/2026-10-09/4, MSC06-C/2026-10-09/5"
