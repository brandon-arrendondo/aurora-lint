[metadata]
id = "MSC37-C"
type = "rule"
category = "MSC"
number = 37
title = "Ensure that control never reaches the end of a non-void function"
description = """
If control reaches the closing curly brace (}) of a non- void function without
evaluating a return statement, using the return value of the function call is
undefined behavior. (See undefined behavior 86.)
"""
severity = "High"
likelihood = "Unlikely"
priority = "P6"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Aug 31, 2025"

[rules.cert_c.MSC37-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/MSC37-C.+Ensure+that+control+never+reaches+the+end+of+a+non-void+function"
cwe = ["CWE-758"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
basis = "no; default and strict agree on noreturn trust (MSC37-C/2026-10-07/noreturn). Pedantic's trust in the C library follows P/facts."
ruling = "MSC37-C/2026-10-07/noreturn, P/facts"
