[metadata]
id = "MSC33-C"
type = "rule"
category = "MSC"
number = 33
title = "Do not pass invalid data to the asctime() function"
description = """
The C Standard, 7.29.3.1 [ISO/IEC 9899:2024], provides the following sample
implementation of the asctime() function:
This function is supposed to output a character string of 26 characters at most,
including the terminating null character. If we count the length indicated by
the format directives, we arrive at 25. Taking into account the terminating null
character, the array size of the string appears sufficient.
However, this implementation assumes that the values of the struct tm data are
within normal ranges and does nothing to enforce the range limit. If any of the
values print more characters than expected, the sprintf() function may overflow
the result array. For example, if tm_year has the value 12345, then 27
characters (including the terminating null character) are printed, resulting in
a buffer overflow.
"""
severity = "High"
likelihood = "Likely"
priority = "P9"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 31, 2025"

[rules.cert_c.MSC33-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/MSC33-C.+Do+not+pass+invalid+data+to+the+asctime%28%29+function"
