[metadata]
id = "INT00-C"
type = "recommendation"
category = "INT"
number = 0
title = "Understand the data model used by your implementation(s)"
description = """
A data model defines the sizes assigned to standard data types. It is important
to understand the data models used by your implementation. However, if your code
depends on any assumptions not guaranteed by the standard, you should provide
static assertions to ensure that your assumptions are valid. (See DCL03-C. Use a
static assertion to test the value of a constant expression.) Assumptions
concerning integer sizes may become invalid, for example, when porting from a
32-bit architecture to a 64-bit architecture.
"""
