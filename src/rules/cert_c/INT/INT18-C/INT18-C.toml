[metadata]
id = "INT18-C"
type = "recommendation"
category = "INT"
number = 18
title = "Evaluate integer expressions in a larger size before comparing or assigning to that size"
description = """
If an integer expression involving an operation is compared to or assigned to a
larger integer size, that integer expression should be evaluated in that larger
size by explicitly casting one of the operands.
"""
severity = "High"
likelihood = "Likely"
priority = "P18"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 20, 2025"

[rules.cert_c.INT18-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/INT18-C.+Evaluate+integer+expressions+in+a+larger+size+before+comparing+or+assigning+to+that+size"
cwe = []
related_cwe = ["CWE-190", "CWE-681"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
overlap = "INT02-C owns the dropped unsigned-vs-negative-literal form"
basis = "yes, at default only (INT18-C/2026-10-09/4, INT18-C/2026-10-09/5). Pedantic equals strict (INT18-C/2026-10-09/3)."
ruling = "INT18-C/2026-10-09/4, INT18-C/2026-10-09/5, INT18-C/2026-10-09/3"
