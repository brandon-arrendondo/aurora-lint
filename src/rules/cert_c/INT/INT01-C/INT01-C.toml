[metadata]
id = "INT01-C"
type = "recommendation"
category = "INT"
number = 1
title = "Use size_t or rsize_t for all integer values representing the size of an object"
description = """
The size_t type is the unsigned integer type of the result of the sizeof
operator. Variables of type size_t are guaranteed to be of sufficient precision
to represent the size of an object. The limit of size_t is specified by the
SIZE_MAX macro.
The type size_t generally covers the entire address space. Any variable that is
used to represent the size of an object, including integer values used as sizes,
indices, loop counters, and lengths, should be declared size_t.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P8"
level = "L2"
