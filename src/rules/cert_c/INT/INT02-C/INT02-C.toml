[metadata]
id = "INT02-C"
type = "recommendation"
category = "INT"
number = 2
title = "Understand integer conversion rules"
description = """
Conversions can occur explicitly as the result of a cast or implicitly as
required by an operation. Although conversions are generally required for the
correct execution of a program, they can also lead to lost or misinterpreted
data. Conversion of an operand value to a compatible type causes no change to
the value or the representation.
The C integer conversion rules define how C compilers handle conversions. These
rules include integer promotions, integer conversion rank, and the usual
arithmetic conversions. The intent of the rules is to ensure that the
conversions result in the same numerical values and that these values minimize
surprises in the rest of the computation. Prestandard C usually preferred to
preserve signedness of the type.
"""
