[metadata]
id = "INT35-C"
type = "rule"
category = "INT"
number = 35
title = "Use correct integer precisions"
description = '''
Integer types in C have both a size and a precision. The size indicates the
number of bytes used by an object and can be retrieved for any object or type
using the sizeof operator. The precision of an integer type is the number of
bits it uses to represent values, excluding any sign and padding bits.
Padding bits contribute to the integer's size, but not to its precision.
Consequently, inferring the precision of an integer type from its size may
result in too large a value, which can then lead to incorrect assumptions about
the numeric range of these types. Programmers should use correct integer
precisions in their code, and in particular, should not use the sizeof operator
to compute the precision of an integer type on architectures that use padding
bits or in strictly conforming (that is, portable) programs.
'''
severity = "Low"
likelihood = "Unlikely"
priority = "P1"
level = "L3"
