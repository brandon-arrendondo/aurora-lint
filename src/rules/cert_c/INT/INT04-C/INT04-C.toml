[metadata]
id = "INT04-C"
type = "recommendation"
category = "INT"
number = 4
title = "Enforce limits on integer values originating from tainted sources"
description = """
All integer values originating from tainted sources should be evaluated to
determine if they have identifiable upper and lower bounds. If so, these limits
should be enforced by the interface. Restricting the input of excessively large
or small integers helps prevent overflow, truncation, and other type range
errors. Furthermore, it is easier to find and correct input problems than it is
to trace internal errors back to faulty inputs.
"""
severity = "High"
likelihood = "Probable"
priority = "P12"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 20, 2025"

[rules.cert_c.INT04-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/INT04-C.+Enforce+limits+on+integer+values+originating+from+tainted+sources"
cwe = ["CWE-400", "CWE-789"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "stricter"
differs = true
basis = "yes, in every column: the source set (INT04-C/2026-10-09/1), parameter presumption (INT04-C/2026-10-09/2), project sinks (INT04-C/2026-10-09/3), loops (INT04-C/2026-10-09/5) and default's named options (INT04-C/2026-10-09/presets)."
ruling = "INT04-C/2026-10-09/1, INT04-C/2026-10-09/2, INT04-C/2026-10-09/3, INT04-C/2026-10-09/5, INT04-C/2026-10-09/presets"
