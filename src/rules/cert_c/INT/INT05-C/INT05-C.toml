[metadata]
id = "INT05-C"
type = "recommendation"
category = "INT"
number = 5
title = "Do not use input functions to convert character data if they cannot handle all possible inputs"
description = """
Do not use functions that input characters and convert them to integers if the
functions cannot handle all possible inputs. For example, formatted input
functions such as scanf(), fscanf(), vscanf(), and vfscanf() can be used to read
string data from stdin or (in the cases of fscanf() and vfscanf()) other input
streams. These functions work fine for valid integer values but lack robust
error handling for invalid values.
Alternatively, input character data as a null-terminated byte string and convert
to an integer value using strtol() or a related function. (See ERR34-C. Detect
errors when converting a string to a number.)
"""
severity = "Medium"
likelihood = "Probable"
priority = "P8"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 20, 2025"

[rules.cert_c.INT05-C]
enabled = true

[references]
