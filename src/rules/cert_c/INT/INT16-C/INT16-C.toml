[metadata]
id = "INT16-C"
type = "recommendation"
category = "INT"
number = 16
title = "Do not make assumptions about representation of signed integers"
description = """
Although many common implementations use a two's complement representation of
signed integers, the C Standard declares such use as implementation-defined and
allows all of the following representations:
- Sign and magnitude
- Two's complement
- One's complement
This is a specific example of MSC14-C. Do not introduce unnecessary platform
dependencies.
"""
severity = "Medium"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 20, 2025"

[rules.cert_c.INT16-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/INT16-C.+Do+not+make+assumptions+about+representation+of+signed+integers"

[presets]
default = "not_enforced"
strict = "not_enforced"
pedantic = "not_enforced"
differs = false
overlap = "INT13-C, INT32-C"
basis = "no. Not enforced in any preset."
