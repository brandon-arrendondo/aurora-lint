[metadata]
id = "WIN00-C"
type = "recommendation"
category = "WIN"
number = 0
title = "Be specific when dynamically loading libraries"
description = """
The LoadLibrary() or LoadLibraryEx() function calls [MSDN] allow you to
dynamically load a library at runtime and use a specific algorithm to locate the
library within the file system [MSDN]. It is possible for an attacker to place a
file on the DLL search path such that your application inadvertently loads and
executes arbitrary source code.
"""
severity = "High"
likelihood = "Unlikely"
priority = "P6"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 20, 2025"

[rules.cert_c.WIN00-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/WIN00-C.+Be+specific+when+dynamically+loading+libraries"
cwe = ["CWE-114"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "stricter"
differs = true
basis = "yes, at pedantic only. Default equals strict (amended 2026-10-09)."
