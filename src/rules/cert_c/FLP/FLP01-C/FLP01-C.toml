[metadata]
id = "FLP01-C"
type = "recommendation"
category = "FLP"
number = 1
title = "Take care in rearranging floating-point expressions"
description = """
Be careful when rearranging floating-point expressions to ensure the greatest
accuracy of the result.
Subclause 5.1.2.3, paragraph 14, of the C Standard [ISO/IEC 9899:2011], states:
Rearrangement for floating-point expressions is often restricted because of
limitations in precision as well as range. The implementation cannot generally
apply the mathematical associative rules for addition or multiplication, nor the
distributive rule, because of roundoff error, even in the absence of overflow
and underflow. Likewise, implementations cannot generally replace decimal
constants to rearrange expressions. In the following fragment, rearrangements
suggested by mathematical rules for real numbers are often not valid. double x,
y, z; /*... */ x = (x * y) * z; /* not equivalent to x *= y * z; */ z = (x - y)
+ y; /* not equivalent to z = x; */ z = x + x * y; /* not equivalent to z = x *
(1.0 + y); */ y = x / 5.0; /* not equivalent to y = x * 0.2; */
"""
severity = "Low"
likelihood = "Probable"
priority = "P2"
level = "L3"
