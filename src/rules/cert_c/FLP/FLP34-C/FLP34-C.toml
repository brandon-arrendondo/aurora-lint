[metadata]
id = "FLP34-C"
type = "rule"
category = "FLP"
number = 34
title = "Ensure that floating-point conversions are within range of the new type"
description = """
If a floating-point value is to be converted to a floating-point value of a
smaller range and precision or to an integer type, or if an integer type is to
be converted to a floating-point type, the value must be representable in the
destination type.
The C Standard, 6.3.1.4, paragraph 2 [ISO/IEC 9899:2024], says,
When a finite value of decimal floating type is converted to an integer type
other than bool, the fractional part is discarded (i.e. the value is truncated
toward zero). If the value of the integral part cannot be represented by the
integer type, the "invalid" floating-point exception shall be raised and the
result of the conversion is unspecified.
Paragraph 2 of the same subclause says,
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P3"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.FLP34-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/FLP34-C.+Ensure+that+floating-point+conversions+are+within+range+of+the+new+type"
cwe = ["CWE-681"]
related_cwe = ["CWE-197"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
overlap = "INT31-C reported float-to-int today; FLP34-C owns it"
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
