[metadata]
id = "FLP36-C"
type = "rule"
category = "FLP"
number = 36
title = "Preserve precision when converting integral values to floating-point type"
description = """
Narrower arithmetic types can be cast to wider types without any effect on the
magnitude of numeric values. However, whereas integer types represent exact
values, floating-point types have limited precision. The C Standard, 6.3.1.4
paragraph 3 [ISO/IEC 9899:2024], states
When a value of integer type is converted to a standard floating type, if the
value being converted can be represented exactly in the new type, it is
unchanged. If the value being converted is in the range of values that can be
represented but cannot be represented exactly, the result is either the nearest
higher or nearest lower representable value, chosen in an implementation-defined
manner. If the value being converted is outside the range of values that can be
represented, the behavior is undefined. Results of some implicit conversions may
be represented in greater range and precision than that required by the new type
(see 6.3.1.8 and 6.8.7.5).
Conversion from integral types to floating-point types without sufficient
precision can lead to loss of precision (loss of least significant bits). No
runtime exception occurs despite the loss.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Oct 29, 2025"

[rules.cert_c.FLP36-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/FLP36-C.+Preserve+precision+when+converting+integral+values+to+floating-point+type"
cwe = []

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
options = ["assert_is_guard"]
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
code_lags = "A strippable assert still guards under default only (assert_is_guard); the ruling reads one form in every preset."
