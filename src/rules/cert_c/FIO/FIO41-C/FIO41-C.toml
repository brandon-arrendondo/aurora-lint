[metadata]
id = "FIO41-C"
type = "rule"
category = "FIO"
number = 41
title = "Do not call getc(), putc(), getwc(), or putwc() with a stream argument that has side effects"
description = """
Do not invoke getc() or putc() or their wide-character analogues getwc() and
putwc() with a stream argument that has side effects. The stream argument passed
to these macros may be evaluated more than once if these functions are
implemented as unsafe macros. (See PRE31-C. Avoid side effects in arguments to
unsafe macros for more information.)
This rule does not apply to the character argument in putc() or the wide-
character argument in putwc(), which is guaranteed to be evaluated exactly once.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P3"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.FIO41-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/FIO41-C.+Do+not+call+getc%28%29%2C+putc%28%29%2C+getwc%28%29%2C+or+putwc%28%29+with+a+stream+argument+that+has+side+effects"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
overlap = "both FIO41-C and PRE31-C fire (overlap policy) unless subsumption is total"
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
