[metadata]
id = "FIO40-C"
type = "rule"
category = "FIO"
number = 40
title = "Reset strings on fgets() or fgetws() failure"
description = """
If either of the C Standard fgets() or fgetws() functions fail, the contents of
the array being written is indeterminate. (See undefined behavior 175.) It is
necessary to reset the string to a known value to avoid errors on subsequent
string manipulation functions.
"""
severity = "Low"
likelihood = "Probable"
priority = "P6"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 06, 2025"

[rules.cert_c.FIO40-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/FIO40-C.+Reset+strings+on+fgets%28%29++or+fgetws%28%29+failure"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
overlap = "unchecked calls stay with ERR33-C"
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
