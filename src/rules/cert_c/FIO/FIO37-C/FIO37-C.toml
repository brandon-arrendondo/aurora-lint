[metadata]
id = "FIO37-C"
type = "rule"
category = "FIO"
number = 37
title = "Do not assume that fgets() or fgetws() returns a nonempty string when successful"
description = """
Errors can occur when incorrect assumptions are made about the type of data
being read. These assumptions may be violated, for example, when binary data has
been read from a file instead of text from a user's terminal or the output of a
process is piped to stdin. (See FIO14-C. Understand the difference between text
mode and binary mode with file streams.) On some systems, it may also be
possible to input a null byte (as well as other binary codes) from the keyboard.
Subclause 7.23.7.2 of the C Standard paragraph 3 [ISO/IEC 9899:2024] says,
The fgets function returns s if successful. If end-of-file is encountered and no
characters have been read into the array, the contents of the array remain
unchanged and a null pointer is returned. If a read error occurs during the
operation, the members of the array have unspecified values and a null pointer
is returned.
The wide-character function fgetws() has the same behavior. Therefore, if
fgets() or fgetws() returns a non-null pointer, it is safe to assume that the
array contains data. However, it is erroneous to assume that the array contains
a nonempty string because the data may contain null characters.
"""
severity = "High"
likelihood = "Probable"
priority = "P18"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.FIO37-C]
enabled = true

