[metadata]
id = "FIO46-C"
type = "rule"
category = "FIO"
number = 46
title = "Do not access a closed file"
description = """
Using the value of a pointer to a FILE object after the associated file is
closed is undefined behavior. (See undefined behavior 153.) Programs that close
the standard streams (especially stdout but also stderr and stdin) must be
careful not to use these streams in subsequent function calls, particularly
those that implicitly operate on them (such as printf(), perror(), and
getchar()).
This rule can be generalized to other file representations.
"""
severity = "Medium"
likelihood = "Unlikely"
priority = "P2"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.FIO46-C]
enabled = true

