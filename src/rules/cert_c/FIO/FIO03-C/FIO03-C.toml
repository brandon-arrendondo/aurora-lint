[metadata]
id = "FIO03-C"
type = "recommendation"
category = "FIO"
number = 3
title = "Do not make assumptions about fopen() and file creation"
description = """
The C fopen() function is used to open an existing file or create a new one. The
C11 version of the fopen() function provides a mode flag, x, that provides the
mechanism needed to determine if the file that is to be opened exists. Not using
this mode flag can lead to a program overwriting or accessing an unintended
file.
"""
