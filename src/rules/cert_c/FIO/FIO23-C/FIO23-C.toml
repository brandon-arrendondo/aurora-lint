[metadata]
id = "FIO23-C"
type = "recommendation"
category = "FIO"
number = 23
title = "Do not exit with unflushed data in stdout or stderr"
description = """
Deprecated
This guideline does not apply to code that need conform only to C23. Code that
must conform to older versions of the C standard should still comply with this
guideline.
The C standard makes no guarantees as to when output to stdout (standard output)
or stderr (standard error) is actually flushed. On many platforms, output to
stdout is buffered unless stdout outputs to a terminal, and stderr output is
typically not buffered. However, programs are free to modify the buffering rules
for either stdout or stderr. Programs are also free to explicitly close stdout
or stderr; if they do not do so, these streams will be closed upon program
termination.
"""
severity = "Medium"
likelihood = "Unlikely"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "Unknown"

[rules.cert_c.FIO23-C]
