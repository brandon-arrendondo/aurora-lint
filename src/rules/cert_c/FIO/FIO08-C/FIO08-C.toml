[metadata]
id = "FIO08-C"
type = "recommendation"
category = "FIO"
number = 8
title = "Take care when calling remove() on an open file"
description = """
Invoking remove() on an open file is implementation-defined. Removing an open
file is sometimes recommended to hide the names of temporary files that may be
prone to attack. (See FIO21-C. Do not create temporary files in shared
directories.)
In cases requiring the removal of an open file, a more strongly defined
function, such as the POSIX unlink() function, should be considered. To be
strictly conforming and portable, remove() should not be called on an open file.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P4"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 20, 2025"

[rules.cert_c.FIO08-C]
