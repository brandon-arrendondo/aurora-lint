[metadata]
id = "FIO10-C"
type = "recommendation"
category = "FIO"
number = 10
title = "Take care when using the rename() function"
description = """
The rename() function has the following prototype:
If the file referenced by dest_file exists prior to calling rename(), the
behavior is implementation-defined. On POSIX systems, the destination file is
removed. On Windows systems, the rename() fails. Consequently, issues arise when
trying to write portable code or when trying to implement alternative behavior.
"""
