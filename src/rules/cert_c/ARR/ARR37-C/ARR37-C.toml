[metadata]
id = "ARR37-C"
type = "rule"
category = "ARR"
number = 37
title = "Do not add or subtract an integer to a pointer to a non-array object"
description = """
Pointer arithmetic must be performed only on pointers that reference elements of
array objects.
The C Standard, 6.5.7 [ISO/IEC 9899:2024], states the following about pointer
arithmetic:
When an expression that has integer type is added to or subtracted from a
pointer, the result has the type of the pointer operand. If the pointer operand
points to an element of an array object, and the array is large enough, the
result points to an element offset from the original element such that the
difference of the subscripts of the resulting and original array elements equals
the integer expression.
"""
severity = "Medium"
likelihood = "Probable"
priority = "P8"
level = "L2"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.ARR37-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/ARR37-C.+Do+not+add+or+subtract+an+integer+to+a+pointer+to+a+non-array+object"
cwe = ["CWE-188"]

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
basis = "default and strict coincide; pedantic equals strict (P/open-cells)."
ruling = "P/open-cells"
