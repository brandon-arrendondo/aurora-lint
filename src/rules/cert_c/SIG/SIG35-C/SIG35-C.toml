[metadata]
id = "SIG35-C"
type = "rule"
category = "SIG"
number = 35
title = "Do not return from a computational exception signal handler"
description = """
According to the C Standard, 7.14.1.1 paragraph 3 [ISO/IEC 9899:2024], if a
signal handler returns when it has been entered as a result of a computational
exception (that is, with the value of its argument of SIGFPE, SIGILL, SIGSEGV,
or any other implementation-defined value corresponding to such an exception)
returns, then the behavior is undefined. (See undefined behavior 130.)
When a signal occurs and func points to a function, it is implementation-defined
whether the equivalent of signal (sig, SIG_DFL); is executed or the
implementation prevents some implementation- defined set of signals (at least
including sig) from occurring until the current signal handling has completed;
in the case of SIGILL, the implementation may alternatively define that no
action is taken. Then the equivalent of (*func)(sig); is executed. If and when
the function returns, if the value of sig is SIGFPE, SIGILL, SIGSEGV, or any
other implementation-defined value corresponding to a computational exception,
the behavior is undefined; otherwise the program will resume execution at the
point it was interrupted.
The Portable Operating System Interface (POSIX ®), Base Specifications, Issue 7
[IEEE Std 1003.1:2013], adds SIGBUS to the list of computational exception
signal handlers:
The behavior of a process is undefined after it returns normally from a signal-
catching function for a SIGBUS, SIGFPE, SIGILL, or SIGSEGV signal that was not
generated by kill(), sigqueue(), or raise().
Do not return from SIGFPE, SIGILL, SIGSEGV, or any other implementation-defined
value corresponding to a computational exception, such as SIGBUS on POSIX
systems, regardless of how the signal was generated.
"""
severity = "Low"
likelihood = "Unlikely"
priority = "P1"
level = "L3"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.SIG35-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/SIG35-C.+Do+not+return+from+a+computational+exception+signal+handler"

[presets]
default = "as_written"
strict = "as_written"
pedantic = "as_written"
differs = false
basis = "no. Default, strict and pedantic coincide (P/coincide)."
ruling = "P/coincide"
