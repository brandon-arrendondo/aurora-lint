[metadata]
id = "SIG31-C"
type = "rule"
category = "SIG"
number = 31
title = "Do not access shared objects in signal handlers"
description = """
Accessing or modifying shared objects in signal handlers can result in race
conditions that can leave data in an inconsistent state. The two exceptions (C
Standard, 5.1.2.3, paragraph 5) to this rule are the ability to read from and
write to lock-free atomic objects and variables of type volatile sig_atomic_t.
Accessing any other type of object from a signal handler is undefined behavior.
(See undefined behavior 131.)
The need for the volatile keyword is described in DCL22-C. Use volatile for data
that cannot be cached.
The type sig_atomic_t is the integer type of an object that can be accessed as
an atomic entity even in the presence of asynchronous interrupts. The type of
sig_atomic_t is implementation-defined, though it provides some guarantees.
Integer values ranging from SIG_ATOMIC_MIN through SIG_ATOMIC_MAX, inclusive,
may be safely stored to a variable of the type. In addition, when sig_atomic_t
is a signed integer type, SIG_ATOMIC_MIN must be no greater than −127 and
SIG_ATOMIC_MAX no less than 127. Otherwise, SIG_ATOMIC_MIN must be 0 and
SIG_ATOMIC_MAX must be no less than 255. The macros SIG_ATOMIC_MIN and
SIG_ATOMIC_MAX are defined in the header <stdint.h>.
"""
severity = "High"
likelihood = "Likely"
priority = "P18"
level = "L1"
cert_version = "2016 Edition (Wiki)"
last_modified = "May 05, 2025"

[rules.cert_c.SIG31-C]
enabled = true

[references]
wiki = "https://wiki.sei.cmu.edu/confluence/display/c/SIG31-C.+Do+not+access+shared+objects+in+signal+handlers"
cwe = ["CWE-364"]
related_cwe = ["CWE-662", "CWE-828"]

[presets]
default = "narrowed"
strict = "as_written"
pedantic = "as_written"
differs = true
overlap = "SIG30-C"
basis = "yes, at default only, through three named options (SIG31-C/2026-10-10/3-5). Pedantic reports what strict reports and adds loud declines (SIG31-C/2026-10-10/1, 7, 8)."
ruling = "SIG31-C/2026-10-10/3-5, SIG31-C/2026-10-10/1, SIG31-C/2026-10-10/7, SIG31-C/2026-10-10/8"
