---
# Ansible playbook: base development environment for a node that will work
# on tools_sqc itself (not just run benchmarks).
#
# Covers the three things CLAUDE.md/docs/benchmark-setup.rst assume are
# already present but never actually provision:
#   - Rust toolchain (rustup) -- rust-toolchain.toml pins channel 1.95.0 +
#     clippy/rustfmt/rust-analyzer; rustup picks that up automatically the
#     first time cargo/rustc runs inside the repo.
#   - Native build deps for `cargo build` itself -- git2's vendored
#     libgit2-sys build needs a C toolchain, cmake, and pkg-config even
#     though sqc is otherwise pure Rust.
#   - Docs toolchain -- docs/conf.py builds with Sphinx + sphinx_rtd_theme
#     (HTML) and LaTeX/texlive (PDF); neither is installed by any existing
#     playbook or documented anywhere in docs/.
#   - invoke (pyinvoke) -- CLAUDE.md's version-bump workflow runs
#     `invoke bump-version --new-version X.Y.Z`; there's a tasks.py at the
#     repo root but nothing that installs the `invoke` package itself.
#   - pre-commit + the git hook it installs -- CLAUDE.md requires every
#     pre-commit hook to pass before a commit; nothing previously installed
#     the tool or ran `pre-commit install` in the repo.
#   - Repo-local git config -- .git/config is not tracked, so a fresh clone
#     gets none of it. Three settings matter here: the todo-sqlite-cli merge
#     driver that .gitattributes already names (without it every pull that
#     touched the DB lands in conflict); pull.rebase=false, so a pull that
#     raced another node merges through that driver instead of halting on
#     "need to specify how to reconcile divergent branches"; and
#     pack.window/pack.depth, which git's defaults set far too low for the
#     ~2.3 MiB SQLite file committed on nearly every task change -- 664 KiB
#     of pack per DB commit at the default window=10 against 38 KiB at 250.
#     See the tasks for the numbers.
#   - clew-trace -- .mcp.json (gitignored, written by `clew init` -- see
#     CLAUDE.md's Code Navigation section) points at the `clew-mcp` command;
#     without the package installed that command doesn't resolve and the
#     clew MCP server silently fails to start.
#   - cargo-sweep + an hourly cron job bounding cargo's target/ growth --
#     found missing entirely on one of two otherwise-identically-provisioned
#     dev nodes (2026-08-31), which is exactly the kind of silent drift this
#     playbook exists to prevent. Hourly (not nightly) per task 661: cargo
#     never collects old incremental sessions on its own, so a long gap
#     between passes lets target/ accrete well past MAX_TARGET_GB between
#     checks. Small-disk nodes need this; a node with plenty of headroom
#     can skip it (`-e install_disk_guard=false`).
#
# NOT covered here, deliberately:
#   - ansible itself. Bootstrapping the tool this playbook runs under from
#     inside itself is circular -- install it before running this playbook,
#     e.g. `sudo apt install -y ansible` or `pipx install ansible-core`.
#   - Comparison tools (cppcheck, clang-tidy, Infer, Frama-C -- see
#     install-static-analyzers.yml and docs/benchmark-setup.rst), the 9
#     real-world codebase checkouts (see setup-benchmark-repos.yml),
#     third-party library -I headers for those checkouts (also
#     benchmark-setup.rst), and editor/terminal conveniences (vim, htop,
#     tmux) -- none of those are dependencies of building or testing sqc.
#
# Usage:
#   ansible-playbook playbooks/setup-dev-environment.yml -i "localhost," -c local \
#     --ask-become-pass
#   # Or into an existing/shared venv instead of a new dedicated one:
#   ansible-playbook playbooks/setup-dev-environment.yml -i "localhost," -c local \
#     --ask-become-pass -e dev_venv=~/data-enterprise/venv
#   # Skip the disk-guard cron on a node with plenty of headroom:
#   ansible-playbook playbooks/setup-dev-environment.yml -i "localhost," -c local \
#     --ask-become-pass -e install_disk_guard=false

- name: Set up a tools_sqc development node
  hosts: all
  vars:
    project_dir: "{{ playbook_dir }}/.."
    # The sibling benchmarking repo, which since 2026-09-03 keeps its OWN
    # todo-sqlite-cli.db and therefore needs the same repo-local git config as
    # this one. Skipped silently when not present: a node that only clones
    # tools_sqc is a supported setup, and most are.
    benchmarking_db_dir: "{{ playbook_dir }}/../../benchmarking_db"
    # Override with -e dev_venv=... (e.g. an existing venv shared across
    # repos, like ~/data-enterprise/venv) to install into it instead of
    # creating a new dedicated one.
    dev_venv: "{{ ansible_env.HOME }}/.venvs/sqc-dev"
    install_disk_guard: true

  tasks:
    # ── Native build deps (cargo build itself) ───────────────────────────

    - name: Install native build dependencies (git2-sys vendored libgit2 build)
      become: true
      apt:
        name:
          - build-essential
          - cmake
          - pkg-config
          - libssl-dev
          - zlib1g-dev
        state: present
        update_cache: true

    # ── Rust toolchain ────────────────────────────────────────────────────

    - name: Check if rustup is already installed
      stat:
        path: "{{ ansible_env.HOME }}/.cargo/bin/rustup"
      register: rustup_bin

    - name: Install rustup (non-interactive, default profile)
      shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
          sh -s -- -y --default-toolchain none
      args:
        executable: /bin/bash
      when: not rustup_bin.stat.exists

    - name: Install the pinned toolchain + components from rust-toolchain.toml
      command: "{{ ansible_env.HOME }}/.cargo/bin/rustup show"
      args:
        chdir: "{{ project_dir }}"
      changed_when: false
      # `rustup show`, run from inside the repo, reads rust-toolchain.toml
      # and installs the pinned channel + components (clippy, rustfmt,
      # rust-analyzer) on first invocation if not already present.

    - name: Verify cargo is on PATH via rustup's shim
      command: "{{ ansible_env.HOME }}/.cargo/bin/cargo --version"
      args:
        chdir: "{{ project_dir }}"
      register: cargo_version_out
      changed_when: false

    - name: Confirm sqc itself builds
      command: "{{ ansible_env.HOME }}/.cargo/bin/cargo build --release"
      args:
        chdir: "{{ project_dir }}"
      register: cargo_build_out
      changed_when: "'Compiling sqc' in cargo_build_out.stderr or 'Finished' in cargo_build_out.stderr"

    # ── Docs toolchain (Sphinx HTML + LaTeX/PDF) + invoke ────────────────

    - name: Install python3-venv and LaTeX toolchain for docs builds
      become: true
      apt:
        name:
          - python3-venv
          - texlive-full
        state: present
        update_cache: true

    - name: Create a dedicated venv for dev tooling (docs build + invoke)
      command: python3 -m venv "{{ dev_venv }}"
      args:
        creates: "{{ dev_venv }}/bin/activate"

    - name: Install Sphinx, the RTD theme, invoke, pre-commit, and clew-trace into the dev venv
      pip:
        name:
          - sphinx
          - sphinx-rtd-theme
          - invoke
          - pre-commit
          - clew-trace
        virtualenv: "{{ dev_venv }}"
        state: present

    - name: Verify the docs build (HTML)
      command: >-
        {{ dev_venv }}/bin/sphinx-build -b html
        {{ project_dir }}/docs /tmp/sqc-docs-check
      register: sphinx_check
      changed_when: false

    - name: Verify invoke sees tasks.py
      command: "{{ dev_venv }}/bin/invoke --list"
      args:
        chdir: "{{ project_dir }}"
      register: invoke_check
      changed_when: false

    # Installs BOTH the pre-commit and commit-msg hooks: the config sets
    # default_install_hook_types, so a plain `install` covers the commit-msg
    # hook that rejects the Co-Authored-By: Claude trailer. Older clones that
    # installed before that hook existed need one manual pass --
    # `pre-commit install --hook-type commit-msg`. See CLAUDE.md.
    - name: Install the pre-commit and commit-msg git hooks into this checkout
      command: "{{ dev_venv }}/bin/pre-commit install"
      args:
        chdir: "{{ project_dir }}"
      register: precommit_install
      changed_when: "'installing' in precommit_install.stdout | lower"

    # ── Repo-local git config (uncommitted, so every clone needs it) ─────
    #
    # Both settings below live in .git/config, which is NOT tracked. A fresh
    # clone gets neither, and nothing in the repo makes their absence visible
    # until it bites.

    - name: Detect which repos keep a committed todo-sqlite-cli.db
      stat:
        path: "{{ item }}/.git"
      register: todo_repos
      loop:
        - "{{ project_dir }}"
        - "{{ benchmarking_db_dir }}"

    - name: Tune pack settings for the tracked todo-sqlite-cli.db
      community.general.git_config:
        name: "{{ item.1.name }}"
        value: "{{ item.1.value }}"
        scope: local
        repo: "{{ item.0.item }}"
      when: item.0.stat.exists
      loop: "{{ todo_repos.results | product([
                  {'name': 'pack.window', 'value': '250'},
                  {'name': 'pack.depth',  'value': '100'}]) | list }}"
      loop_control:
        label: "{{ item.0.item | basename }} {{ item.1.name }}"
      # todo-sqlite-cli.db is a ~2.3 MiB SQLite file committed on nearly every
      # task change -- 692 of 3,571 commits as of 2026-09-03. Git's default
      # pack.window of 10 is far too small to find a good delta base among
      # ~680 versions of it, so recent versions were being stored close to
      # whole: 664 KiB of pack per DB commit against a 39 KiB historical
      # average. At window=250 that drops to 38 KiB, and the file's total
      # on-disk history goes 25.7 MiB -> 9.1 MiB (.git overall 58 MB -> 41 MB).
      #
      # Setting this only affects FUTURE repacks. A node provisioned before
      # this task existed keeps its bloated pack until repacked once by hand:
      #   git repack -a -d --window=250 --depth=100
      # That is a pure storage-layout rewrite -- it never changes commit SHAs
      # or history -- so it is safe to run on any clone at any time.

    - name: Register the todo-sqlite-cli merge driver
      community.general.git_config:
        name: "{{ item.1.name }}"
        value: "{{ item.1.value }}"
        scope: local
        repo: "{{ item.0.item }}"
      when: item.0.stat.exists
      loop: "{{ todo_repos.results | product([
                  {'name': 'merge.todo-sqlite-cli.name',
                   'value': 'todo-sqlite-cli 3-way merge driver'},
                  {'name': 'merge.todo-sqlite-cli.driver',
                   'value': 'todo-sqlite-cli git-merge-driver %O %A %B'}]) | list }}"
      loop_control:
        label: "{{ item.0.item | basename }} {{ item.1.name }}"
      # .gitattributes maps `todo-sqlite-cli.db merge=todo-sqlite-cli` and IS
      # committed, but the driver it names is repo-local config that is not.
      # Without this, git falls back to the binary default and leaves the DB
      # in conflict on every pull that touched it -- see CLAUDE.md's "PULLING
      # FROM UPSTREAM" section.
      #
      # Registered by hand rather than via `todo-sqlite-cli install-merge-driver`
      # because that command also appends the .gitattributes line
      # unconditionally, which would duplicate the one already committed here.

    - name: Reconcile pulls by merging, not rebasing
      community.general.git_config:
        name: pull.rebase
        value: "false"
        scope: local
        repo: "{{ item.item }}"
      when: item.stat.exists
      loop: "{{ todo_repos.results }}"
      loop_control:
        label: "{{ item.item | basename }}"
      # git 2.27+ refuses to pull divergent branches without being told how,
      # so without this every pull that raced another node stops with
      # "fatal: Need to specify how to reconcile divergent branches".
      #
      # Merge is the right answer *because* of the driver registered above: a
      # merge invokes it once on the two DB tips and unions them by task UUID.
      # A rebase replays each local DB commit onto the new base instead,
      # running the driver once per commit against a moving target -- more
      # driver invocations, more chances to stop, and no benefit, since the DB
      # is a binary blob whose history nobody reads commit-by-commit.
      #
      # Set per-repo rather than globally: the rationale is this repo's
      # committed SQLite DB, not a general preference about pull style.

    - name: Verify clew-mcp resolves (the command .mcp.json points at)
      command: "{{ dev_venv }}/bin/clew-mcp --help"
      register: clew_mcp_check
      changed_when: false
      failed_when: false
      # clew init itself (writing .mcp.json) is a per-machine, per-agent-session
      # step documented in CLAUDE.md's Code Navigation section, not something
      # this playbook does on your behalf -- this only confirms the command
      # that config will point at actually exists once you do run it.

    # ── Disk guard (cargo-sweep + nightly target/ cap) ───────────────────

    - name: Install cargo-sweep
      command: "{{ ansible_env.HOME }}/.cargo/bin/cargo install cargo-sweep --locked"
      args:
        creates: "{{ ansible_env.HOME }}/.cargo/bin/cargo-sweep"
      when: install_disk_guard | bool

    - name: Ensure ~/bin exists
      file:
        path: "{{ ansible_env.HOME }}/bin"
        state: directory
        mode: "0755"
      when: install_disk_guard | bool

    - name: Install the cargo-target-gc.sh script
      copy:
        src: "{{ project_dir }}/scripts/cargo-target-gc.sh"
        dest: "{{ ansible_env.HOME }}/bin/cargo-target-gc.sh"
        mode: "0755"
      when: install_disk_guard | bool

    - name: Create ~/.local/state for the gc log
      file:
        path: "{{ ansible_env.HOME }}/.local/state"
        state: directory
        mode: "0755"
      when: install_disk_guard | bool

    - name: Schedule hourly cargo-target-gc.sh via cron
      cron:
        name: "cargo-target-gc"
        minute: "17"
        job: >-
          PATH=$HOME/.cargo/bin:/usr/bin:/bin $HOME/bin/cargo-target-gc.sh
          >> $HOME/.local/state/cargo-target-gc.log 2>&1
      when: install_disk_guard | bool

    # ── Summary ──────────────────────────────────────────────────────────

    - name: Development environment summary
      debug:
        msg:
          - "cargo:  {{ cargo_version_out.stdout }}"
          - "dev venv: {{ dev_venv }}"
          - "pre-commit hook: {{ precommit_install.stdout | default('installed') }}"
          - "clew-mcp: {{ 'OK' if clew_mcp_check.rc == 0 else 'NOT ON PATH -- check the dev venv install' }}"
          - "disk guard cron: {{ 'installed (hourly :17)' if install_disk_guard | bool else 'skipped (-e install_disk_guard=false)' }}"
          - ""
          - "Activate the dev venv for docs builds and invoke tasks:"
          - "  source {{ dev_venv }}/bin/activate"
          - "  sphinx-build -b html docs docs/_build/html"
          - "  sphinx-build -b latex docs docs/_build/latex && make -C docs/_build/latex"
          - "  invoke bump-version --new-version X.Y.Z"
          - ""
          - "Register the clew MCP server once per machine (see CLAUDE.md):"
          - "  cd {{ project_dir }} && {{ dev_venv }}/bin/clew init"
