---
# Ansible playbook: install every tool aurora-lint is compared against, on Debian 12
# (bookworm) or Ubuntu 24.04 (noble)
#
# Usage:
#   ansible-playbook playbooks/install-static-analyzers.yml -i "localhost," -c local \
#     --ask-become-pass
#
# What it installs:
#   - cppcheck             (apt)  -> /usr/bin/cppcheck
#   - clang-tidy {{ clang_tidy_version }} (apt.llvm.org) -> /usr/bin/clang-tidy
#   - Facebook Infer v1.2.0 (prebuilt binary) -> /opt/infer-linux-x86_64-v1.2.0/
#   - Frama-C latest (via opam) -> ~/.opam/
#
# cppcheck and clang-tidy were previously missing here even though
# setup-dev-environment.yml names this playbook as where they come from, so a
# freshly-provisioned node could run neither -- and `python -m bench
# realworld-run --tool cppcheck` failed with a bare "not found on PATH".
# cppcheck is taken from apt at whatever version the distro ships: the
# benchmark runner records the version it actually saw, so the difference is
# visible in the data instead of being an assumption made here.
#
# clang-tidy is PINNED, and deliberately so. Ubuntu 24.04 ships 18.1.3 and
# tops out at 20, while the published comparison in docs/tool-comparison.rst
# is LLVM 21.1 -- so taking the distro default makes a freshly-provisioned
# node measure an OLDER competitor than the table it will be compared
# against. clang-tidy is the tool currently beating aurora-lint on the Juliet overlap
# (99.2% vs 81.7%), so that regression would flatter aurora-lint by understating a
# rival, which is the one direction a benchmark must never drift. Hence
# apt.llvm.org and an explicit version.
#
# To move the pin, change clang_tidy_version and re-run; the LLVM repository
# is per-release, so the apt source line follows it.
#
# Infer and Frama-C are the BUILD-BASED pair: neither can be pointed at a
# source tree the way cppcheck and aurora-lint can, so a real-world run of either
# also needs playbooks/setup-compile-commands.yml to have generated that
# checkout's compile_commands.json (task 767).
#
# After running:
#   cppcheck --version && clang-tidy --version   # expect LLVM 21.x
#   infer --version
#   eval $(opam env) && frama-c -version

- name: Install cppcheck, clang-tidy, Infer and Frama-C on Debian 12 / Ubuntu 24.04
  hosts: all
  vars:
    # Matches docs/tool-comparison.rst's published clang-tidy column. See the
    # header for why this is pinned when cppcheck is not.
    clang_tidy_version: "21"
    infer_version: "1.2.0"
    infer_sha256: "21504063fb3a1dbc7919f34dc6e50ca0d35f50b996d91deb7b8bea8243d52d82"
    infer_install_dir: "/opt/infer-linux-x86_64-v{{ infer_version }}"
    opam_root: "{{ ansible_env.HOME }}/.opam"

  tasks:
    # ── cppcheck (distro apt) + clang-tidy (apt.llvm.org, pinned) ────────

    - name: Install cppcheck
      become: true
      apt:
        name: cppcheck
        state: present
        update_cache: true

    - name: Add the LLVM apt signing key
      become: true
      get_url:
        url: https://apt.llvm.org/llvm-snapshot.gpg.key
        dest: /etc/apt/keyrings/apt.llvm.org.asc
        mode: "0644"

    - name: Add the LLVM {{ clang_tidy_version }} apt repository
      become: true
      apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc]
          http://apt.llvm.org/{{ ansible_distribution_release }}/
          llvm-toolchain-{{ ansible_distribution_release }}-{{ clang_tidy_version }} main
        filename: "llvm-{{ clang_tidy_version }}"
        state: present
        update_cache: true

    - name: Install clang-tidy {{ clang_tidy_version }}
      become: true
      apt:
        name: "clang-tidy-{{ clang_tidy_version }}"
        state: present

    - name: Make clang-tidy {{ clang_tidy_version }} the default clang-tidy
      become: true
      alternatives:
        name: clang-tidy
        link: /usr/bin/clang-tidy
        path: "/usr/bin/clang-tidy-{{ clang_tidy_version }}"
        priority: 100

    - name: Verify cppcheck and clang-tidy
      shell: cppcheck --version && clang-tidy --version | head -1
      register: source_tools_out
      changed_when: false

    - name: Show cppcheck and clang-tidy versions
      debug:
        var: source_tools_out.stdout_lines

    # ── Infer (prebuilt binary) ──────────────────────────────────────────

    - name: Check if Infer is already installed
      stat:
        path: "{{ infer_install_dir }}/bin/infer"
      register: infer_bin

    - name: Check whether libtinfo.so.5 already exists (Infer links against it)
      stat:
        path: /usr/lib/x86_64-linux-gnu/libtinfo.so.5
      register: libtinfo5_before

    - name: Install libtinfo5 (Infer links against libtinfo.so.5)
      become: true
      apt:
        name: libtinfo5
        state: present
      register: libtinfo5_apt
      failed_when: false
      when: not libtinfo5_before.stat.exists
      # Package present on Debian 12 (bookworm); REMOVED entirely on Ubuntu
      # 24.04 (noble) -- there this always fails with "no package matching
      # libtinfo5", not a distinguishable rc. The apt module does not
      # reliably set `.rc` on a package-not-found failure (unlike a real
      # command failure), so gating the symlink fallback on
      # `libtinfo5_apt.rc` silently skipped it here: the fallback never ran,
      # `infer --version` failed on the missing .so, and it looked like a
      # clean, silent success. Gate on the actual filesystem state instead
      # (below), which is true regardless of how the apt attempt failed.

    - name: Re-check libtinfo.so.5 after the install attempt
      stat:
        path: /usr/lib/x86_64-linux-gnu/libtinfo.so.5
      register: libtinfo5_after

    - name: Symlink libtinfo.so.6 as libtinfo.so.5 (fallback if libtinfo5 unavailable)
      become: true
      file:
        src: /usr/lib/x86_64-linux-gnu/libtinfo.so.6
        dest: /usr/lib/x86_64-linux-gnu/libtinfo.so.5
        state: link
      when: not libtinfo5_after.stat.exists

    - name: Download Infer v{{ infer_version }} tarball
      get_url:
        url: "https://github.com/facebook/infer/releases/download/v{{ infer_version }}/infer-linux-x86_64-v{{ infer_version }}.tar.xz"
        dest: "/tmp/infer-linux-x86_64-v{{ infer_version }}.tar.xz"
        checksum: "sha256:{{ infer_sha256 }}"
      when: not infer_bin.stat.exists

    - name: Create /opt directory for Infer
      become: true
      file:
        path: /opt
        state: directory
        mode: "0755"

    - name: Extract Infer to /opt
      become: true
      unarchive:
        src: "/tmp/infer-linux-x86_64-v{{ infer_version }}.tar.xz"
        dest: /opt
        remote_src: true
        creates: "{{ infer_install_dir }}/bin/infer"

    - name: Symlink infer to /usr/local/bin
      become: true
      file:
        src: "{{ infer_install_dir }}/bin/infer"
        dest: /usr/local/bin/infer
        state: link

    - name: Verify Infer installation
      command: infer --version
      register: infer_version_out
      changed_when: false

    - name: Show Infer version
      debug:
        var: infer_version_out.stdout_lines

    # ── Frama-C (via opam) ───────────────────────────────────────────────

    - name: Install system dependencies for opam and Frama-C
      become: true
      apt:
        name:
          # opam and OCaml build essentials
          - opam
          - gcc
          - make
          - m4
          - pkg-config
          - autoconf
          - g++
          # Frama-C dependencies
          - libgmp-dev
          - zlib1g-dev
          - libgtk-3-dev
          - libgtksourceview-3.0-dev
          # Optional: graphviz for call graph output
          - graphviz
        state: present
        update_cache: true

    - name: Check if opam is initialized
      stat:
        path: "{{ opam_root }}/config"
      register: opam_config

    - name: Initialize opam (non-interactive)
      command: opam init --bare --no-setup --disable-sandboxing
      when: not opam_config.stat.exists

    - name: Check if opam default switch exists
      command: opam switch list --short
      register: opam_switches
      changed_when: false

    - name: Create opam switch with OCaml 4.14
      command: opam switch create default 4.14.2
      when: "'default' not in opam_switches.stdout"
      environment:
        OPAMYES: "1"

    - name: Check if Frama-C is installed
      shell: eval $(opam env) && which frama-c
      register: framac_check
      changed_when: false
      failed_when: false

    - name: Install Frama-C via opam (this takes ~10-20 minutes)
      shell: eval $(opam env) && opam install frama-c
      environment:
        OPAMYES: "1"
      when: framac_check.rc != 0
      # opam builds from source; give it time
      async: 3600
      poll: 30

    - name: Verify Frama-C installation
      shell: eval $(opam env) && frama-c -version
      register: framac_version_out
      changed_when: false

    - name: Show Frama-C version
      debug:
        var: framac_version_out.stdout_lines

    # ── Summary ──────────────────────────────────────────────────────────

    - name: Installation summary
      debug:
        msg:
          - "{{ source_tools_out.stdout_lines | join(' / ') }}"
          - "Infer:   {{ infer_version_out.stdout_lines[0] | default('installed') }}"
          - "Frama-C: {{ framac_version_out.stdout_lines[0] | default('installed') }}"
          - ""
          - "Add to your shell profile for Frama-C:"
          - "  eval $(opam env)"
