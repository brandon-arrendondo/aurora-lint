---
# Fetch the reference shadow set (data/reference_corpus.json) at its pins:
# the never-labeled codebases a change is A/B'd over to see what it moves on
# code nobody tuned against (docs/design/reference-corpus-ab.md).
#
# Optional, and a one-time setup: the checkouts stay where they are fetched,
# and `bench reference-ab` re-checks each one at its pin before scanning it,
# so nothing needs fetching again until the pins change. Nothing else in the
# repository needs the shadow set.
#
# The pins live in data/reference_corpus.json and nowhere else. This playbook
# does not clone anything itself: it runs `python -m bench reference-fetch`
# from this checkout, so the shallow fetch, the detach on the pin and the
# clean happen exactly as they do before every A/B scan.
#
# Shadow scans run on the host, outside the benchmark container, with no
# compile database and whatever system headers the machine has (docs/adr/0018,
# Decision 6). So nothing here installs headers or builds anything.
#
# Usage:
#   ansible-playbook playbooks/setup-shadow-corpus.yml -i "localhost," -c local
#   ansible-playbook playbooks/setup-shadow-corpus.yml -i "localhost," -c local \
#     -e shadow_tier=all        # every tier, the large one included
#
# Before fetching, it asserts room for about twice the tier's measured size,
# so a full disk fails before any clone rather than part-way through. The
# check is skipped when every checkout of the tier is already at its pin.
# Checkouts go under BENCH_ROOT/shadow_corpus/ (bench/config.py: $SQC_BENCH_ROOT,
# .env, ~/toolchain).

# hosts: all, like setup-dev-environment.yml, which imports this play. Both
# act on the checkout they are run from, so run them with -i "localhost," -c local.
- name: Fetch the reference shadow set at its pins
  hosts: all
  vars:
    project_dir: "{{ playbook_dir }}/.."
    # quick, standard, large or all; each tier includes the smaller ones,
    # so large and all are the same set.
    shadow_tier: standard
    # About twice each cumulative tier's measured on-disk size (shallow
    # checkouts, .git included), rounded up.
    shadow_required_gb:
      quick: 1
      standard: 2
      large: 11
      all: 11
  tasks:
    - name: Count the tier's checkouts not yet at their pins, and the free space
      command: >-
        python3 -c "import shutil; from bench import reference;
        root = reference.default_root();
        repos = reference.load('{{ shadow_tier }}');
        missing = sum(not reference.at_pin(root / r['name'], r['commit']) for r in repos);
        p = next(a for a in (root, *root.parents) if a.exists());
        print(missing, shutil.disk_usage(p).free // 2**30)"
      args:
        chdir: "{{ project_dir }}"
      register: shadow_state
      changed_when: false

    - name: Require room for the tier before fetching
      vars:
        shadow_missing: "{{ shadow_state.stdout.split()[0] | int }}"
        shadow_free_gb: "{{ shadow_state.stdout.split()[1] | int }}"
      assert:
        that: shadow_free_gb | int >= shadow_required_gb[shadow_tier]
        fail_msg: >-
          The {{ shadow_tier }} tier needs about {{ shadow_required_gb[shadow_tier] }} GB
          free where the shadow checkouts go; {{ shadow_free_gb }} GB is free.
          Free space, set SQC_BENCH_ROOT to a larger filesystem, or pick a smaller
          tier with -e shadow_tier=...
        quiet: true
      when: shadow_missing | int > 0

    - name: Fetch each codebase in the tier
      command: python3 -m bench reference-fetch --tier {{ shadow_tier }}
      args:
        chdir: "{{ project_dir }}"
      register: fetched
      changed_when: "' fetched' in fetched.stdout"

    - name: Report each codebase's state
      debug:
        var: fetched.stdout_lines
