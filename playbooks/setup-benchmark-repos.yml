---
# Ansible playbook: clone and pin every real-world benchmark codebase
#
# Provisions BENCH_ROOT (default ~/toolchain, override with -e bench_root=...
# or by exporting SQC_BENCH_ROOT before running) with the 9 codebases in
# mcp_servers/realworld_server.py's CODEBASES registry, each checked out at
# the exact commit its ground-truth oracle was adjudicated against. Keep
# bench_root in sync with SQC_BENCH_ROOT in your .env (see .env.example) --
# they must point at the same directory.
#
# Does NOT fetch the Juliet test suite: NIST SARD (https://samate.nist.gov/
# SARD/test-suites/112) is a click-through portal with no stable direct
# download URL, so that step stays manual (see docs/benchmark-setup.rst).
# This playbook only creates the expected juliet-test-suite-c/ parent dir
# and reports whether the suite is already in place.
#
# Usage:
#   ansible-playbook playbooks/setup-benchmark-repos.yml -i "localhost," -c local
#   ansible-playbook playbooks/setup-benchmark-repos.yml -i "localhost," -c local \
#     -e bench_root=/data/toolchain
#
# After running:
#   git -C ~/toolchain/libcrc rev-parse HEAD   # etc., verify pinned SHAs

- name: Clone and pin real-world benchmark codebases
  hosts: all
  vars:
    bench_root: "{{ lookup('env', 'SQC_BENCH_ROOT') | default(ansible_env.HOME + '/toolchain', true) }}"
    # Pins live in data/benchmark_repos.json -- the single source of truth,
    # shared with `python -m bench corpus-check`, which verifies the
    # checkouts this playbook creates are still sitting on them. Do not
    # inline the SHAs here again (task 619).
    repos: "{{ (lookup('file', playbook_dir + '/../data/benchmark_repos.json') | from_json)['repos'] }}"

  tasks:
    - name: Create bench_root directory
      file:
        path: "{{ bench_root }}"
        state: directory
        mode: "0755"

    - name: Clone and checkout each codebase at its pinned commit
      git:
        repo: "{{ item.repo }}"
        dest: "{{ bench_root }}/{{ item.name }}"
        version: "{{ item.version }}"
        force: false
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.name }}@{{ item.version[:12] }}"

    - name: Verify each checkout landed on its pinned commit
      command: git -C "{{ bench_root }}/{{ item.name }}" rev-parse HEAD
      register: checkout_heads
      changed_when: false
      loop: "{{ repos }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fail if any checkout drifted from its pinned commit
      fail:
        msg: >-
          {{ item.item.name }} is at {{ item.stdout }}, expected
          {{ item.item.version }}
      when: item.stdout != item.item.version
      loop: "{{ checkout_heads.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Third-party library headers (resolves -I include paths; see docs/benchmark-setup.rst)
      become: true
      apt:
        name:
          - libssl-dev
          - libcjson-dev
          - zlib1g-dev
          - libcunit1-dev
          - libsqlite3-dev
          - libmbedtls-dev
          - libgnutls28-dev
          - tcl-dev
          - libnl-3-dev
          - libnl-genl-3-dev
          - libdbus-1-dev
          - libgcrypt20-dev
          - libpcap-dev
          - libwolfssl-dev
        state: present
        update_cache: true
      tags: [headers]

    - name: Check whether the Juliet test suite is already in place
      stat:
        path: "{{ bench_root }}/benchmarks/juliet-test-suite-c/testcases"
      register: juliet_testcases

    - name: Create benchmarks/ parent directory for the (manually downloaded) Juliet suite
      file:
        path: "{{ bench_root }}/benchmarks"
        state: directory
        mode: "0755"
      when: not juliet_testcases.stat.exists

    - name: Juliet test suite still needs manual placement
      debug:
        msg: >-
          Juliet Test Suite v1.3 not found at
          {{ bench_root }}/benchmarks/juliet-test-suite-c/testcases -- download
          it from https://samate.nist.gov/SARD/test-suites/112 (NIST portal,
          no stable direct-download URL) and extract it so that
          testcases/CWE*/ (118 dirs) and testcasesupport/ land under
          {{ bench_root }}/benchmarks/juliet-test-suite-c/.
      when: not juliet_testcases.stat.exists

    - name: Juliet test suite already present
      debug:
        msg: "Found at {{ bench_root }}/benchmarks/juliet-test-suite-c/testcases"
      when: juliet_testcases.stat.exists
